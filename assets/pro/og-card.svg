      <stop offset="0" stop-color="#0E1630"/>
      <stop offset="0.55" stop-color="#080C14"/>
      <stop offset="1" stop-color="#080C14"/>
    </linearGradient>
    <radialGradient id="og-cyan" cx="0.18" cy="0.2" r="0.55">
