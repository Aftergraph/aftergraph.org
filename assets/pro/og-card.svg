<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Aftergraph social card">
  <title>Aftergraph — Intelligent work that can prove the outcome</title>
  <defs>
