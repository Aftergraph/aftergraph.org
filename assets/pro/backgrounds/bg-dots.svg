<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="Dot background pattern">
  <title>Background — dot tile</title>
  <defs>
    <pattern id="ag-dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#42C7E8" fill-opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="#080C14"/>
  <rect width="480" height="480" fill="url(#ag-dots)"/>
</svg>
