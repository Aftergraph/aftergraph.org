<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="Grid background pattern">
  <title>Background — grid tile</title>
  <defs>
    <pattern id="ag-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#F5F7FA" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="#080C14"/>
  <rect width="480" height="480" fill="url(#ag-grid)"/>
</svg>
