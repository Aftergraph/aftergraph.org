      <path d="M168 182h20"/><path d="M184 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
      <path d="M324 182h20"/><path d="M340 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
      <path d="M480 182h20"/><path d="M496 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
      <path d="M648 182h20"/><path d="M664 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
      <path d="M804 182h20"/><path d="M820 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
      <path d="M960 182h20"/><path d="M976 177l8 5-8 5z" fill="#42C7E8" stroke="none"/>
    </g>
  </g>
  <!-- Evidence receipt card -->
  <g>
    <rect x="330" y="300" width="520" height="180" rx="16" fill="#080C14" stroke="#24C4AD" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="372" cy="342" r="16" fill="none" stroke="#24C4AD" stroke-width="2.5"/>
    <path d="M364 342l6 6 11-12" fill="none" stroke="#24C4AD" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="338" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="17" fill="#F5F7FA">evidence sealed · mission #4821</text>
    <text x="400" y="362" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="14" fill="#8993A4">sha256:9f2c…e41a · independent verify</text>
    <rect x="372" y="384" width="436" height="10" rx="5" fill="#F5F7FA" fill-opacity="0.10"/>
    <rect x="372" y="404" width="300" height="10" rx="5" fill="#F5F7FA" fill-opacity="0.10"/>
    <rect x="372" y="424" width="360" height="10" rx="5" fill="#42C7E8" fill-opacity="0.30"/>
