<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="560" viewBox="0 0 1180 560" role="img" aria-label="Aftergraph operating model illustration">
  <title>From intent to verified outcome</title>
  <defs>
    <pattern id="hero-grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#F5F7FA" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <radialGradient id="hero-glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#42C7E8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#42C7E8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1180" height="560" rx="24" fill="#0E1630" fill-opacity="0.55"/>
  <rect width="1180" height="560" rx="24" fill="url(#hero-grid)"/>
  <rect width="1180" height="560" rx="24" fill="url(#hero-glow)"/>
  <rect x="1" y="1" width="1178" height="558" rx="23" fill="none" stroke="#F5F7FA" stroke-opacity="0.08" stroke-width="2"/>
  <!-- Pipeline nodes -->
  <g font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="600" text-anchor="middle">
    <g>
      <rect x="40" y="150" width="128" height="64" rx="12" fill="#080C14" stroke="#8993A4" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="104" cy="168" r="5" fill="#8993A4"/>
      <text x="104" y="200" fill="#F5F7FA">Intent</text>
    </g>
    <g>
      <rect x="196" y="150" width="128" height="64" rx="12" fill="#080C14" stroke="#7759E8" stroke-width="1.5"/>
      <circle cx="260" cy="168" r="5" fill="#7759E8"/>
      <text x="260" y="200" fill="#F5F7FA">Mission</text>
    </g>
    <g>
      <rect x="352" y="150" width="128" height="64" rx="12" fill="#080C14" stroke="#7759E8" stroke-width="1.5"/>
      <circle cx="416" cy="168" r="5" fill="#7759E8"/>
      <text x="416" y="200" fill="#F5F7FA">Authority</text>
    </g>
    <g>
      <rect x="508" y="150" width="140" height="64" rx="12" fill="#080C14" stroke="#F0A64A" stroke-width="1.5"/>
      <circle cx="578" cy="168" r="5" fill="#F0A64A"/>
      <text x="578" y="200" fill="#F5F7FA">Enforcement</text>
    </g>
    <g>
      <rect x="676" y="150" width="128" height="64" rx="12" fill="#080C14" stroke="#4C8BD8" stroke-width="1.5"/>
      <circle cx="740" cy="168" r="5" fill="#4C8BD8"/>
      <text x="740" y="200" fill="#F5F7FA">Execution</text>
    </g>
    <g>
      <rect x="832" y="150" width="128" height="64" rx="12" fill="#080C14" stroke="#24C4AD" stroke-width="1.5"/>
      <circle cx="896" cy="168" r="5" fill="#24C4AD"/>
      <text x="896" y="200" fill="#F5F7FA">Evidence</text>
    </g>
    <g>
