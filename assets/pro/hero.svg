  <!-- Floating orbs -->
  <circle cx="150" cy="400" r="42" fill="#7759E8" fill-opacity="0.16"/>
  <circle cx="150" cy="400" r="42" fill="none" stroke="#7759E8" stroke-opacity="0.5" stroke-width="1.5"/>
  <circle cx="1040" cy="400" r="42" fill="#42C7E8" fill-opacity="0.12"/>
  <circle cx="1040" cy="400" r="42" fill="none" stroke="#42C7E8" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M150 388l12 12-12 12-12-12z" fill="#7759E8" fill-opacity="0.8"/>
  <path d="M1040 388l12 12-12 12-12-12z" fill="#42C7E8" fill-opacity="0.9"/>
  <text x="590" y="90" font-family="Inter,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="22" font-weight="500" letter-spacing="3" fill="#8993A4" text-anchor="middle">FROM INTENT TO <tspan fill="#24C4AD">VERIFIED OUTCOME</tspan></text>
</svg>
