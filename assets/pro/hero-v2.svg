<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-label="Aftergraph governed pipeline hero">
  <title>Aftergraph — hero v2: from graphs to verified outcomes</title>
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1630"/><stop offset="1" stop-color="#080C14"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#42C7E8"/><stop offset="1" stop-color="#24C4AD"/></linearGradient>
    <pattern id="hgrid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0v56" fill="none" stroke="#8993A4" stroke-opacity=".12"/></pattern>
  </defs>
  <rect width="1600" height="800" rx="28" fill="url(#hbg)"/>
  <rect width="1600" height="800" rx="28" fill="url(#hgrid)"/>
  <circle cx="1330" cy="140" r="300" fill="#42C7E8" opacity=".06"/>
  <circle cx="1330" cy="140" r="200" fill="#7759E8" opacity=".07"/>
  <text x="90" y="150" font-family="JetBrains Mono,monospace" font-size="22" letter-spacing="4" fill="#42C7E8">GOVERNED AUTONOMOUS INTELLIGENCE</text>
  <text x="88" y="260" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="84" font-weight="600" letter-spacing="-1" fill="#F5F7FA">Every agent action,</text>
  <text x="88" y="352" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="84" font-weight="600" letter-spacing="-1" fill="#F5F7FA">sealed<tspan fill="#24C4AD"> as evidence.</tspan></text>
  <text x="90" y="420" font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="26" fill="#8993A4">Graphs → boundaries → authority → execution → evidence → verified outcomes.</text>
  <g font-family="Inter,-apple-system,'Segoe UI',sans-serif" font-size="24" font-weight="600">
    <rect x="90" y="470" width="250" height="64" rx="12" fill="#42C7E8"/><text x="215" y="511" text-anchor="middle" fill="#080C14">Launch mission</text>
    <rect x="360" y="470" width="250" height="64" rx="12" fill="none" stroke="#8993A4" stroke-opacity=".5" stroke-width="2"/><text x="485" y="511" text-anchor="middle" fill="#F5F7FA">Verify evidence</text>
  </g>
  <g transform="translate(90,590)">
    <g font-family="JetBrains Mono,monospace" font-size="19">
      <rect x="0" y="0" width="200" height="120" rx="12" fill="#0E1630" stroke="#4C8BD8" stroke-width="2"/><text x="24" y="44" fill="#4C8BD8">◈ GRAPHS</text><text x="24" y="74" fill="#8993A4">nodes · edges</text><text x="24" y="98" fill="#24C4AD">● live</text>
      <rect x="240" y="0" width="200" height="120" rx="12" fill="#0E1630" stroke="#8993A4" stroke-width="2"/><text x="264" y="44" fill="#F5F7FA">▣ BOUNDARY</text><text x="264" y="74" fill="#8993A4">tenant scope</text><text x="264" y="98" fill="#F0A64A">● gated</text>
      <rect x="480" y="0" width="200" height="120" rx="12" fill="#0E1630" stroke="#7759E8" stroke-width="2"/><text x="504" y="44" fill="#7759E8">⬣ AUTHORITY</text><text x="504" y="74" fill="#8993A4">delegation</text><text x="504" y="98" fill="#F0A64A">● approval</text>
      <rect x="720" y="0" width="200" height="120" rx="12" fill="#0E1630" stroke="#42C7E8" stroke-width="2"/><text x="744" y="44" fill="#42C7E8">▶ EXECUTION</text><text x="744" y="74" fill="#8993A4">sandboxed</text><text x="744" y="98" fill="#42C7E8">● running</text>
      <rect x="960" y="0" width="200" height="120" rx="12" fill="#0E1630" stroke="#24C4AD" stroke-width="2"/><text x="984" y="44" fill="#24C4AD">✔ EVIDENCE</text><text x="984" y="74" fill="#8993A4">merkle-sealed</text><text x="984" y="98" fill="#24C4AD">● verified</text>
      <g stroke="url(#beam)" stroke-width="3"><line x1="200" y1="60" x2="240" y2="60"/><line x1="440" y1="60" x2="480" y2="60"/><line x1="680" y1="60" x2="720" y2="60"/><line x1="920" y1="60" x2="960" y2="60"/></g>
    </g>
  </g>
  <g transform="translate(1150,420)">
    <rect x="0" y="0" width="360" height="230" rx="14" fill="#0E1630" stroke="#42C7E8" stroke-opacity=".45"/>
    <rect x="0" y="0" width="360" height="40" rx="14" fill="#42C7E8" opacity=".14"/>
    <circle cx="26" cy="20" r="5" fill="#FF6B7A"/><circle cx="46" cy="20" r="5" fill="#F0A64A"/><circle cx="66" cy="20" r="5" fill="#24C4AD"/>
    <text x="22" y="84" font-family="JetBrains Mono,monospace" font-size="22" fill="#24C4AD">$ attest --mission 042</text>
    <text x="22" y="120" font-family="JetBrains Mono,monospace" font-size="20" fill="#8993A4">merkle: 9f3a…c1 ✓ sealed</text>
    <text x="22" y="154" font-family="JetBrains Mono,monospace" font-size="20" fill="#42C7E8">policy: PASS · scope: ok</text>
    <rect x="22" y="176" width="316" height="10" rx="5" fill="#8993A4" opacity=".25"/>
    <rect x="22" y="176" width="284" height="10" rx="5" fill="url(#beam)"/>
  </g>
</svg>
