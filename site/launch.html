<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aftergraph Launcher — find public products, systems, research, actions, and verification surfaces by intent.">
<meta name="theme-color" content="#070c14">
<link rel="canonical" href="https://aftergraph.org/launch">
<title>Launcher — Aftergraph</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23070c14'/><path d='M16 5l9 5v12l-9 5-9-5V10z' fill='none' stroke='%2342c7e8' stroke-width='2'/></svg>">
<style>
:root{
  color-scheme:dark;
  --bg:#070c14;--panel:#09152a;--panel-deep:#071225;--surface:#0b1930;
  --text:#f3f7fb;--muted:#8d9bb0;--faint:#637187;--line:#263952;
  --cyan:#42c7e8;--cyan-soft:rgba(66,199,232,.12);--teal:#27d6bb;
  --amber:#f0a64a;--violet:#8268e8;--radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg)}
body{
  min-height:100svh;overflow-x:hidden;color:var(--text);
  font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 52% 0%,rgba(25,67,116,.15),transparent 35%),var(--bg);
}
a{color:inherit;text-decoration:none} button,input{font:inherit}
.visually-hidden{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.brand-link{position:absolute;top:30px;left:48px;z-index:20;color:var(--cyan);font-size:13px;font-weight:760;letter-spacing:.045em;text-transform:uppercase}
.scene{position:relative;min-height:100svh;padding:58px 24px 44px;display:flex;justify-content:center;overflow:hidden}
.launcher-shell{position:relative;z-index:5;width:min(860px,calc(100vw - 48px));margin:auto 0}
.intro{text-align:center;margin-bottom:26px}
.intro-title{margin:0;font-size:39px;line-height:1.05;font-weight:420;letter-spacing:-.025em;color:#f5f8fc}
.intro-title em{font-style:italic;font-weight:380;color:var(--cyan)}
.phase-line{display:flex;align-items:center;justify-content:center;gap:17px;margin-top:16px;color:#9db9d3;font-size:12px;letter-spacing:.28em;text-transform:uppercase}
.phase-line .arrow{color:#69b8dd;letter-spacing:0}
.launcher-panel{overflow:hidden;border:1px solid rgba(86,112,145,.48);border-radius:var(--radius);background:linear-gradient(180deg,rgba(10,23,48,.94),rgba(6,16,34,.97));box-shadow:0 28px 85px rgba(0,0,0,.36),inset 0 1px rgba(255,255,255,.025);backdrop-filter:blur(16px)}
.search-zone{padding:18px 24px 0;background:linear-gradient(180deg,rgba(10,23,48,.96),rgba(10,23,48,.86))}
.search-box{display:flex;align-items:center;gap:13px;min-height:64px;padding:0 18px;border:1px solid #315275;border-radius:14px;background:rgba(9,24,48,.8);box-shadow:inset 0 1px rgba(255,255,255,.02)}
.search-icon{width:22px;height:22px;flex:0 0 auto;color:var(--cyan)}
.search-box input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:16px;letter-spacing:.005em}
.search-box input::placeholder{color:#8290a8;opacity:1}
kbd{flex:0 0 auto;min-width:46px;padding:4px 8px;border:1px solid rgba(117,139,168,.35);border-radius:6px;background:rgba(21,34,58,.72);color:#aab5c5;font:11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:center;box-shadow:inset 0 1px rgba(255,255,255,.035)}
.hint{display:flex;align-items:center;gap:18px;padding:11px 7px 12px;color:#78869a;font-size:11px}
.hint .spacer{flex:1}.hint-touch{display:none}.hint strong{font-weight:500;color:#94a2b7}
.results{max-height:min(650px,calc(100svh - 300px));overflow:auto;padding:7px 0 12px;scrollbar-width:thin;scrollbar-color:#243a59 transparent}
.results::-webkit-scrollbar{width:8px}.results::-webkit-scrollbar-thumb{background:#243a59;border:2px solid transparent;border-radius:999px;background-clip:padding-box}
.group-head{display:flex;align-items:center;gap:12px;padding:13px 28px 7px;color:#98a8bd;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.group-head::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,rgba(64,90,121,.65),rgba(64,90,121,.15))}
.group-count{order:3;color:#7a899e;letter-spacing:0;text-transform:none;font-size:11px}
.item{position:relative;display:grid;grid-template-columns:36px minmax(126px,160px) minmax(0,1fr) auto 20px;align-items:center;gap:12px;min-height:48px;padding:8px 28px;border-left:3px solid transparent;cursor:pointer;color:var(--text)}
.item::before{content:"";position:absolute;inset:0;background:transparent;pointer-events:none}
.item.active{border-left-color:var(--cyan);background:linear-gradient(90deg,rgba(38,116,162,.24),rgba(38,116,162,.08) 76%,transparent)}
@media(pointer:fine){.item:hover{background:rgba(66,199,232,.055)}}
.item.active:hover{background:linear-gradient(90deg,rgba(38,116,162,.25),rgba(38,116,162,.09) 76%,transparent)}
.item-icon{display:grid;place-items:center;width:28px;height:28px;color:#55bde8}.item-icon svg{width:22px;height:22px;display:block}
.item[data-icon="sentinel"] .item-icon,.item[data-icon="brand"] .item-icon{color:var(--violet)}
.item[data-icon="trust"] .item-icon{color:#4ab8e8}.item[data-icon="verify"] .item-icon{color:#62d9d0}
.item-name{font-size:14px;font-weight:660;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-desc{min-width:0;color:#8290a6;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-right{display:flex;align-items:center;justify-content:flex-end;min-width:92px}
.item-arrow{color:var(--cyan);font-size:16px;opacity:.86}
.badge{display:inline-flex;align-items:center;justify-content:center;padding:2px 9px;border:1px solid;border-radius:999px;font-size:9px;font-weight:760;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.badge-production{color:var(--teal);border-color:rgba(39,214,187,.52);background:rgba(39,214,187,.10)}
.badge-demo,.badge-prototype{color:var(--amber);border-color:rgba(240,166,74,.45);background:rgba(240,166,74,.11)}
.badge-internal,.badge-research,.badge-org{color:#9aa8bc;border-color:rgba(154,168,188,.34);background:rgba(154,168,188,.09)}
.empty{padding:48px 28px 54px;text-align:center;color:#78869b}.empty strong{display:block;margin-bottom:6px;color:#b7c3d3;font-weight:600}
.back{text-align:center;margin-top:27px;color:#7d8ba0;font-size:12px}.back a{padding:8px 12px}.back a:hover{color:#a8b5c7}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.graph-wing{position:absolute;top:36.5%;width:calc((100vw - 860px)/2 + 12px);height:470px;transform:translateY(-42%);opacity:.9;pointer-events:none}
.graph-wing svg{width:100%;height:100%;overflow:visible}.graph-left{left:0}.graph-right{right:0}
.graph-line{fill:none;stroke:rgba(64,178,224,.34);stroke-width:1}.graph-dot{fill:#49c8f0}.graph-junction{fill:#48bfe8;filter:drop-shadow(0 0 5px rgba(66,199,232,.45))}
.side-copy{position:absolute;z-index:2;color:#7286a0;font-size:10px;line-height:2.35;letter-spacing:.22em;text-transform:uppercase;pointer-events:none}
.side-copy.left{left:55px;top:31%}.side-copy.right{right:45px;top:37%}.side-copy.bottom-left{left:46px;top:auto;bottom:49px}.side-copy.bottom-right{right:44px;top:auto;bottom:45px}
.side-copy b{display:block;color:#8ba0b9;font-weight:520}.side-copy .accent{color:#9ab0c9}
@keyframes graphPulse{0%,100%{opacity:.6}50%{opacity:1}}
.graph-junction,.graph-dot{animation:graphPulse 4.6s ease-in-out infinite}
@media(pointer:coarse){.hint>span:not(.spacer):not(#count):not(.hint-touch){display:none}.hint-touch{display:block}}
@media(max-width:1180px){.graph-wing,.side-copy{display:none}.launcher-shell{width:min(860px,calc(100vw - 36px))}}
@media(max-width:720px){
  .scene{display:block;padding:76px 12px calc(30px + env(safe-area-inset-bottom))}.brand-link{top:26px;left:20px}
  .launcher-shell{width:100%;margin:0}.intro{display:none}.launcher-panel{border-radius:16px}
  .search-zone{position:sticky;top:0;z-index:8;padding:12px 12px 0;background:#0a1730}
  .search-box{min-height:58px;padding:0 14px;border-radius:12px}.search-box input{font-size:17px}.search-box kbd{display:none}
  .hint{padding:10px 4px 11px}.hint>span:not(.spacer):not(#count):not(.hint-touch){display:none}.hint-touch{display:block}.results{max-height:none;padding-top:4px}
  .group-head{padding:13px 18px 8px;font-size:10px}.item{grid-template-columns:30px minmax(0,1fr) auto 18px;gap:10px;min-height:56px;padding:10px 18px}
  .item-desc{display:none}.item-name{font-size:16px}.item-right{min-width:0}.item-arrow{font-size:15px}.badge{font-size:9px;padding:3px 9px}
  .back{margin-top:18px;padding-bottom:4px;font-size:13px}
}
@media(max-width:390px){.scene{padding-left:8px;padding-right:8px}.brand-link{left:16px}.item{padding-left:14px;padding-right:14px}.group-head{padding-left:15px;padding-right:15px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="brand-link" href="/">← AFTERGRAPH</a>
<div class="scene">
  <div class="graph-wing graph-left" aria-hidden="true">
    <svg viewBox="0 0 360 470" preserveAspectRatio="none">
      <path class="graph-line" d="M0 66 C96 70 163 105 222 176 S303 220 358 235"/>
      <path class="graph-line" d="M0 121 C103 126 168 143 227 190 S306 224 358 235"/>
      <path class="graph-line" d="M0 196 C91 196 169 198 236 213 S313 230 358 235"/>
      <path class="graph-line" d="M0 284 C94 282 164 270 232 251 S307 240 358 235"/>
      <path class="graph-line" d="M0 351 C90 344 159 317 225 278 S305 244 358 235"/>

  </div>

    <svg viewBox="0 0 360 470" preserveAspectRatio="none">

  <main class="launcher-shell">
    <header class="intro">
      <h1 class="intro-title">Aftergraph <em>Launcher</em></h1>
      <div class="phase-line" aria-label="Find, understand, act, verify"><span>FIND</span><span class="arrow">→</span><span>UNDERSTAND</span><span class="arrow">→</span><span>ACT</span><span class="arrow">→</span><span>VERIFY</span></div>
    </header>

    <section class="launcher-panel" aria-label="Aftergraph Launcher">
      <div class="search-zone">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <label class="visually-hidden" for="q">Search Aftergraph products, systems, repositories, research, and actions</label>
          <input id="q" type="text" placeholder="Find a product, system, repo, research, or action…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="results" aria-activedescendant="launcher-option-0" aria-label="Search Aftergraph Launcher">

      </div>
      <div class="results" id="results" role="listbox" aria-label="Launcher results"></div>
    </section>
    <div class="back"><a href="/">←&nbsp; Back to aftergraph.org</a></div>

<script>
const PRODUCTS = [
  {id:"studio",kind:"destination",group:"Products / Systems",name:"Studio",description:"General-purpose operating environment for governed agent work",url:"/studio/",maturity:"demo",aliases:["chat","work","space","use","operate"],icon:"studio"},
  {id:"work-intelligence",kind:"destination",group:"Products / Systems",name:"Work Intelligence",description:"Source-neutral observations become structured WorkItems",url:"https://github.com/Aftergraph/wi-backend",maturity:"prototype",aliases:["wie","wi-backend","work intelligence engine","workitems"],icon:"wie"},
  {id:"sentinel",kind:"destination",group:"Products / Systems",name:"Sentinel",description:"Verified code-review and exact-commit merge-readiness verdicts",url:"/sentinel",maturity:"prototype",aliases:["verify","verification","code review","ship","evidence"],icon:"sentinel"},
  {id:"works-execution",kind:"destination",group:"Products / Systems",name:"WORKS Execution",description:"Durable execution plane — missions, scheduling, leases and recovery",url:"https://github.com/Aftergraph/works-execution",maturity:"prototype",aliases:["works","execution","mission","workgraph","scheduler"],icon:"works"},
  {id:"trust-gateway",kind:"destination",group:"Products / Systems",name:"Trust Gateway",description:"Fail-closed runtime control — policy, approvals and audit",url:"https://github.com/Aftergraph/trust-gateway",maturity:"prototype",aliases:["trust","policy","approval","authority","audit"],icon:"trust"},
  {id:"aie",kind:"destination",group:"Products / Systems",name:"AIE",description:"Agentic Institution Engineering — authority and delegation semantics",url:"https://github.com/Aftergraph/aie",maturity:"prototype",aliases:["agentic institution engineering","authority","delegation","agents"],icon:"aie"},
  {id:"runtime",kind:"destination",group:"Products / Systems",name:"Aftergraph Runtime",description:"Agent lifecycle, orchestration, dispatch and runtime telemetry",url:"https://docs.aftergraph.org/platform/",maturity:"internal",aliases:["runtime","orchestration","dispatch","telemetry"],icon:"runtime"},
  {id:"atlas",kind:"destination",group:"Products / Systems",name:"Atlas",description:"Evidence-aware development observatory and system graph",url:"/atlas",maturity:"production",aliases:["graph","system map","observatory","evidence","dependencies"],icon:"atlas"},
  {id:"knowledge-plane",kind:"destination",group:"Products / Systems",name:"Knowledge Plane (docs)",description:"Live developer and research portal compiled from canonical sources",url:"https://docs.aftergraph.org/",maturity:"production",aliases:["docs","documentation","knowledge","research","standards"],icon:"docs"},
  {id:"brand-os",kind:"destination",group:"Products / Systems",name:"Brand OS",description:"Canonical identity, tokens, assets and communication contracts",url:"https://github.com/Aftergraph/brand",maturity:"production",aliases:["brand","design","tokens","assets","identity"],icon:"brand"},
  {id:"research",kind:"destination",group:"Products / Systems",name:"Intelligence Systems Research",description:"Open research, assurance experiments and replication evidence",url:"https://github.com/Aftergraph/intelligence-systems-research",maturity:"research",aliases:["research","spec-001","mission-bench","assurance"],icon:"research"},
  {id:"governance",kind:"destination",group:"Products / Systems",name:"Governance",description:"Cross-repo contracts, terminology, topology and evidence boundaries",url:"https://github.com/Aftergraph/after-graph-governance",maturity:"production",aliases:["governance","contracts","schemas","topology"],icon:"governance"},
  {id:"github",kind:"destination",group:"Products / Systems",name:"GitHub Organization",description:"Public Aftergraph repositories and community surfaces",url:"https://github.com/Aftergraph",maturity:"org",aliases:["github","repos","repositories","source"],icon:"github"}
];
const ACTIONS = [
  {id:"explore-system",kind:"action",group:"Actions",name:"Explore system",description:"Open Atlas and inspect the evidence-aware system graph",url:"/atlas",aliases:["atlas","graph","map","dependencies","explore"],icon:"atlas",rememberId:"atlas"},
  {id:"verify-sentinel",kind:"action",group:"Actions",name:"Verify with Sentinel",description:"Open the exact-HEAD verification and code-review surface",url:"/sentinel",aliases:["verify","verification","sentinel","ship","review"],icon:"verify",rememberId:"sentinel"},
  {id:"open-docs",kind:"action",group:"Actions",name:"Open documentation",description:"Enter the Aftergraph Knowledge Plane",url:"https://docs.aftergraph.org/",aliases:["docs","documentation","knowledge","research"],icon:"docs",rememberId:"knowledge-plane"},
  {id:"open-status",kind:"action",group:"Actions",name:"Open status",description:"Inspect the public operational snapshot",url:"/status",aliases:["status","health","operations","uptime"],icon:"status"}
];
const FEATURED_PRODUCTS=new Set(["studio","work-intelligence","sentinel","works-execution","trust-gateway","aie","runtime"]);
const FEATURED_ACTIONS=new Set(["explore-system","verify-sentinel","open-docs"]);
const COMMANDS = [...ACTIONS,{id:"clear-recent",kind:"utility",group:"Actions",name:"Clear recent",description:"Forget launcher history stored on this device",action:"clearRecent",aliases:["clear","forget","history","recent"],icon:"clear"}];
const ICONS = {
  studio:'<rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 9h6v6H9z"/>',
  wie:'<path d="M6 17V9M12 17V5M18 17v-6"/>',
  sentinel:'<circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/>',
  works:'<path d="m4 8 8-4 8 4-8 4-8-4Zm0 5 8 4 8-4M4 18l8 4 8-4"/>',
  trust:'<path d="M9.5 14.5 7 17a3 3 0 0 1-4-4l3-3a3 3 0 0 1 4 0M14.5 9.5 17 7a3 3 0 0 1 4 4l-3 3a3 3 0 0 1-4 0M8.5 15.5l7-7"/>',
  aie:'<path d="m12 4 8 15H4L12 4Z"/><circle cx="12" cy="14" r="1"/>',
  runtime:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Zm0 9 8-4.5M12 12 4 7.5M12 12v9"/>',
  atlas:'<circle cx="6" cy="12" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="18" cy="17" r="2"/><path d="m8 11 8-3M8 13l8 3"/>',
  docs:'<path d="M6 3h8l4 4v14H6V3Zm8 0v5h4M9 12h6M9 16h6"/>',
  brand:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><circle cx="12" cy="12" r="2.5"/>',
  research:'<path d="M7 4h10M9 4v6l-4 7a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-4-7V4M8 15h8"/>',
  governance:'<path d="M12 3 20 6v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3Zm-3 9 2 2 4-4"/>',
  github:'<circle cx="12" cy="12" r="8"/><path d="M9 20v-3.5c-2 .4-2.5-.8-3-1.5M15 20v-3.5c0-1 .3-1.7.8-2.2 2.5-.3 5.2-1.2 5.2-5.1 0-1.1-.4-2-1.1-2.8.1-.3.5-1.5-.1-2.8 0 0-.9-.3-2.9 1.1a10 10 0 0 0-5.2 0C9.7 3.3 8.8 3.6 8.8 3.6c-.6 1.3-.2 2.5-.1 2.8A4 4 0 0 0 7.6 9.2c0 3.9 2.7 4.8 5.2 5.1"/>',
  verify:'<circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.2 2.2 4.8-5"/>',
  status:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',
  clear:'<path d="M7 7l10 10M17 7 7 17"/>'
};
const q=document.getElementById('q');
const results=document.getElementById('results');
const count=document.getElementById('count');
const focusKey=document.getElementById('focus-key');
const productById=new Map(PRODUCTS.map(item=>[item.id,item]));
const itemByUrl=new Map([...PRODUCTS,...ACTIONS].map(item=>[item.url,item]));
let filtered=[];let active=0;let recentIds=[];
try{
  const raw=JSON.parse(localStorage.getItem('af-recent')||'[]');
  if(Array.isArray(raw)){
    recentIds=[...new Set(raw.map(value=>productById.has(value)?value:itemByUrl.get(value)?.rememberId||itemByUrl.get(value)?.id).filter(id=>productById.has(id)))].slice(0,5);
  }
}catch(_){recentIds=[];}
function esc(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function icon(name){const body=ICONS[name]||ICONS.runtime;return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+body+'</svg>';}
function badge(item){return item.maturity?'<span class="badge badge-'+esc(item.maturity)+'">'+esc(item.maturity)+'</span>':'';}
function haystack(item){return [item.name,item.description,item.group,...(item.aliases||[])].join(' ').toLowerCase();}
function fuzzy(hay,needle){let j=0;for(let i=0;i<hay.length&&j<needle.length;i++){if(hay[i]===needle[j])j++;}return j===needle.length;}
function score(item,needle){
  if(!needle)return 1;
  const n=needle.toLowerCase();const name=item.name.toLowerCase();const aliases=(item.aliases||[]).map(x=>x.toLowerCase());const hay=haystack(item);
  if(name===n)return 100;if(name.startsWith(n))return 90;if(name.includes(n))return 80;
  if(aliases.some(x=>x===n))return 76;if(aliases.some(x=>x.startsWith(n)))return 70;if(hay.includes(n))return 60;
  const fuzzyTokens=[name,...aliases].flatMap(value=>value.split(/\s+/));
  return fuzzyTokens.some(token=>fuzzy(token,n))?20:-1;
}
function ranked(source,needle){return source.map((item,index)=>({item,index,score:score(item,needle)})).filter(x=>x.score>=0).sort((a,b)=>b.score-a.score||a.index-b.index).map(x=>x.item);}
function recentItems(){return recentIds.map(id=>productById.get(id)).filter(Boolean).map(item=>({...item,group:'Recent'}));}
function matchSet(text){
  const commandMode=text.startsWith('>');const needle=(commandMode?text.slice(1):text).trim();
  if(commandMode)return ranked(COMMANDS,needle);
  if(!needle)return [...recentItems(),...PRODUCTS.filter(item=>FEATURED_PRODUCTS.has(item.id)),...ACTIONS.filter(item=>FEATURED_ACTIONS.has(item.id))];
  return [...ranked(PRODUCTS,needle),...ranked(ACTIONS,needle)];
}
function groupMarkup(label,n){return '<div class="group-head" role="presentation"><span>'+esc(label)+'</span><span class="group-count">'+n+' item'+(n===1?'':'s')+'</span></div>';}
function render(){
  filtered=matchSet(q.value.trim());active=0;
  count.textContent=filtered.length+' hit'+(filtered.length===1?'':'s');
  if(!filtered.length){results.innerHTML='<div class="empty"><strong>No matching destination.</strong>Try a product name, capability, repository, or action.</div>';q.removeAttribute('aria-activedescendant');return;}
  const counts=new Map();for(const item of filtered)counts.set(item.group,(counts.get(item.group)||0)+1);
  let html='';let last='';
  filtered.forEach((item,index)=>{
    if(item.group!==last){html+=groupMarkup(item.group,counts.get(item.group));last=item.group;}
    const label=item.name+(item.description?', '+item.description:'');
    html+='<div class="item'+(index===0?' active':'')+'" role="option" id="launcher-option-'+index+'" aria-selected="'+(index===0)+'" aria-label="'+esc(label)+'" data-i="'+index+'" data-icon="'+esc(item.icon)+'">'
      +'<span class="item-icon">'+icon(item.icon)+'</span>'
      +'<span class="item-name">'+esc(item.name)+'</span>'
      +'<span class="item-desc">'+esc(item.description)+'</span>'
      +'<span class="item-right">'+badge(item)+'</span>'
      +'<span class="item-arrow" aria-hidden="true">→</span></div>';
  });
  results.innerHTML=html;syncActive(false);
}
function syncActive(scroll=true){
  const rows=[...results.querySelectorAll('.item')];
  rows.forEach((row,index)=>{const selected=index===active;row.classList.toggle('active',selected);row.setAttribute('aria-selected',String(selected));});
  if(filtered[active])q.setAttribute('aria-activedescendant','launcher-option-'+active);else q.removeAttribute('aria-activedescendant');
  if(scroll)rows[active]?.scrollIntoView({block:'nearest'});
}
function persistRecents(){try{localStorage.setItem('af-recent',JSON.stringify(recentIds));}catch(_){}}
function remember(item){
  const id=item.rememberId||item.id;if(!productById.has(id))return;
  recentIds=[id,...recentIds.filter(x=>x!==id)].slice(0,5);persistRecents();
}
function openItem(index){
  const item=filtered[index];if(!item)return;
  if(item.action==='clearRecent'){recentIds=[];try{localStorage.removeItem('af-recent');}catch(_){}q.value='';render();return;}
  remember(item);window.location.assign(item.url);
}
results.addEventListener('click',event=>{const row=event.target.closest('.item');if(row)openItem(Number(row.dataset.i));});
if(window.matchMedia('(pointer:fine)').matches){results.addEventListener('mousemove',event=>{const row=event.target.closest('.item');if(!row)return;active=Number(row.dataset.i);syncActive(false);});}
q.addEventListener('input',render);
q.addEventListener('keydown',event=>{
  if(event.key==='ArrowDown'){event.preventDefault();active=Math.min(active+1,filtered.length-1);}
  else if(event.key==='ArrowUp'){event.preventDefault();active=Math.max(active-1,0);}
  else if(event.key==='Home'){event.preventDefault();active=0;}
  else if(event.key==='End'){event.preventDefault();active=Math.max(0,filtered.length-1);}
  else if(event.key==='Enter'){event.preventDefault();openItem(active);return;}
  else if(event.key==='Escape'){event.preventDefault();if(q.value){q.value='';render();}return;}
  else return;
  syncActive();
});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();q.focus();q.select();}});
const mac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);focusKey.textContent=mac?'⌘ K':'Ctrl K';
render();
if(window.matchMedia('(pointer:fine)').matches)q.focus();
</script>
</body>
</html>
