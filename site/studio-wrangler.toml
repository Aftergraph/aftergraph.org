# Studio Tier-0 demo worker (aftergraph-studio).
# Spec: workspace/aftergraph.org/docs/STUDIO-LIVE-SPEC.md ("Hosting config").
# Static Assets only, no worker code. The existing aftergraph-site worker is
# untouched; route aftergraph.org/studio/* -> aftergraph-studio (dashboard/API,
# one manual step). SPA fallback serves the Studio shell for /studio/now etc.
# Security headers (incl. CSP with style-src 'self' 'unsafe-inline' covering
# the 12 existing style attributes) ship as studio-dist/_headers, emitted by
# studio-build.cjs — Workers Static Assets serve that file as _headers.

name = "aftergraph-studio"
compatibility_date = "2024-11-01"

[assets]
directory = "./studio-dist"
not_found_handling = "single-page-application"

[build]
command = "node studio-build.cjs && node verify-studio.cjs build"
