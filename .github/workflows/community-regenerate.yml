name: Materialize community bundle

on:
  push:
    branches: ['community/public-plane']
    paths:
      - '.github/workflows/community-regenerate.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: community/public-plane
      - name: Regenerate worker bundle
        run: node site/build-worker.cjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit generated bundle and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "aftergraph-community-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/worker.js site/wrangler.toml
          git rm .github/workflows/community-regenerate.yml
          git commit -m "community: regenerate worker bundle"
          git push origin HEAD:community/public-plane
