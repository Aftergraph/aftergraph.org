name: Pock M8 F13 pinned headless browser supply smoke

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-lenovo-f13-browser-supply.yml

permissions: {}

jobs:
  browser-supply:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 15
    steps:
      - name: Fetch exact Chrome for Testing version and offline fixture smoke in unique WSL dir
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $probe = @'
          #!/usr/bin/env python3
          """One-shot, isolated Chrome Headless Shell supply and offline smoke probe."""
          from __future__ import annotations
          
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import struct
          import subprocess
          import sys
          import urllib.request
          from zipfile import ZipFile
          
          VERSION = '154.0.8037.57'
          URL = f'https://storage.googleapis.com/chrome-for-testing-public/{VERSION}/linux64/chrome-headless-shell-linux64.zip'
          EXPECTED_BINARY = 'chrome-headless-shell-linux64/chrome-headless-shell'
          
          
          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          
          def run(command: list[str], timeout: int) -> dict:
              proc = subprocess.run(command, stdin=subprocess.DEVNULL, capture_output=True, text=True,
                                    timeout=timeout, check=False)
              return {'exitCode': proc.returncode, 'stdout': proc.stdout[-2000:],
                      'stderr': proc.stderr[-2000:]}
          
          
          def main() -> int:
              if len(sys.argv) != 2 or not re.fullmatch(r'[1-9][0-9]{0,15}', sys.argv[1]):
                  raise ValueError('numeric_run_id_required')
              run_id = sys.argv[1]
              root = Path('/root/pock-m8-f13-supply-' + run_id)
              state = {'contract': 'PockM8F13BrowserSupply/v1', 'runId': run_id,
                       'browserVersionPin': VERSION, 'officialVersionedUrl': URL,
                       'truthStatus': 'BLOCKED', 'publisherSignature': 'NONE_TOFU_SHA256_AT_FETCH',
                       'existingRootfsModified': False, 'pockSourceAccessed': False}
              try:
                  if os.geteuid() != 0 or root.exists() or root.is_symlink():
                      raise RuntimeError('root_required_or_unique_supply_directory_exists')
                  os.umask(0o077)
                  root.mkdir(mode=0o700)
                  archive = root/'chrome-headless-shell-linux64.zip'
                  req = urllib.request.Request(URL, headers={'User-Agent': 'PockM8F13Supply/1'})
                  with urllib.request.urlopen(req, timeout=60) as response, archive.open('xb') as stream:
                      state['httpStatus'] = response.status
                      state['httpContentLength'] = response.headers.get('Content-Length')
                      size = 0
                      while True:
                          chunk = response.read(1024*1024)
                          if not chunk: break
                          size += len(chunk)
                          if size > 500_000_000:
                              raise RuntimeError('archive_size_limit_exceeded')
                          stream.write(chunk)
                  state['archiveBytes'] = archive.stat().st_size
                  state['archiveSha256'] = sha256(archive)
                  state['archiveIdentityStatus'] = 'TOFU_DIGEST_RECORDED_AT_FETCH'
                  if state['httpContentLength'] is not None and int(state['httpContentLength']) != archive.stat().st_size:
                      raise RuntimeError('http_content_length_mismatch')
                  with ZipFile(archive) as z:
                      bad = z.testzip()
                      if bad is not None: raise RuntimeError('zip_crc_failed')
                      members = z.infolist()
                      if len(members) > 1000 or sum(m.file_size for m in members) > 1_000_000_000:
                          raise RuntimeError('zip_expansion_limit_exceeded')
                      names = []
                      for item in members:
                          rel = PurePosixPath(item.filename)
                          if (rel.is_absolute() or '..' in rel.parts or '\\' in item.filename
                                  or not item.filename.startswith('chrome-headless-shell-linux64/')
                                  or (item.external_attr >> 16) & 0o170000 == 0o120000):
                              raise RuntimeError('unsafe_zip_member')
                          names.append(item.filename)
                      if EXPECTED_BINARY not in names:
                          raise RuntimeError('expected_headless_binary_missing')
                      z.extractall(root/'extract')
                  binary = root/'extract'/EXPECTED_BINARY
                  if not binary.is_file(): raise RuntimeError('binary_not_extracted')
                  binary.chmod(binary.stat().st_mode | 0o100)
                  state['binarySha256'] = sha256(binary)
                  state['binaryBytes'] = binary.stat().st_size
                  state['versionProbe'] = run([str(binary),'--version'], 20)
                  state['lddProbe'] = run(['ldd',str(binary)], 20)
                  state['missingDependencies'] = [line.strip() for line in state['lddProbe']['stdout'].splitlines() if 'not found' in line]
                  if state['versionProbe']['exitCode'] != 0 or VERSION not in state['versionProbe']['stdout']:
                      raise RuntimeError('binary_version_probe_failed')
                  if state['missingDependencies']:
                      raise RuntimeError('browser_runtime_dependencies_missing')
                  fixture = root/'fixture.html'
                  fixture.write_text('<!doctype html><html><head><title>Pock F13</title></head><body><h1 id="status">F13 READY</h1></body></html>\n')
                  png = root/'fixture.png'
                  state['smokeProbe'] = run([str(binary),'--headless','--no-sandbox','--disable-gpu',
                                             '--disable-dev-shm-usage','--hide-scrollbars',
                                             '--window-size=800,600','--user-data-dir='+str(root/'profile'),
                                             '--screenshot='+str(png),fixture.as_uri()], 60)
                  if state['smokeProbe']['exitCode'] != 0 or not png.is_file():
                      raise RuntimeError('headless_fixture_smoke_failed')
                  with png.open('rb') as stream: header = stream.read(24)
                  if header[:8] != b'\x89PNG\r\n\x1a\n': raise RuntimeError('screenshot_not_png')
                  state['screenshotWidth'],state['screenshotHeight'] = struct.unpack('>II',header[16:24])
                  state['screenshotBytes'] = png.stat().st_size
                  state['screenshotSha256'] = sha256(png)
                  state['truthStatus'] = 'HOST_HEADLESS_BROWSER_SMOKE_PASS_GUEST_UNEXERCISED'
              except Exception as exc:
                  state['failure'] = type(exc).__name__ + ':' + str(exc)[:500]
              print(json.dumps(state, sort_keys=True))
              return 0 if state['truthStatus'] == 'HOST_HEADLESS_BROWSER_SMOKE_PASS_GUEST_UNEXERCISED' else 2
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($probe))
          $python = "import base64;exec(compile(base64.b64decode('$encoded'),'<f13-browser-supply>','exec'))"
          & wsl.exe -d Ubuntu-26.04 -- python3 -B -c $python $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "f13_supply_exit_$LASTEXITCODE" }
