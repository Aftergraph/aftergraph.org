name: Hermes TypeSafe Session Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/hermes-typesafe-session.yml"

permissions:
  contents: read

concurrency:
  group: hermes-typesafe-session-discovery
  cancel-in-progress: true

jobs:
  legacy-session:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect legacy TypeSafe request-dump metadata only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dir = Join-Path $HOME "AppData\Local\hermes\profiles\avc\sessions"
          if (-not (Test-Path -LiteralPath $dir)) { throw "legacy sessions dir missing" }

          $files = Get-ChildItem -LiteralPath $dir -File -Filter "request_dump_20260917_133857_2ee3ac_*.json" -ErrorAction SilentlyContinue |
            Sort-Object Name

          Write-Host ("MATCHED_DUMPS=" + $files.Count)
          foreach ($f in $files) {
            Write-Host ("DUMP_FILE=" + $f.Name + "; bytes=" + $f.Length)
            try {
              $obj = Get-Content -Raw -LiteralPath $f.FullName | ConvertFrom-Json
              $props = @($obj.PSObject.Properties.Name)
              Write-Host ("TOP_LEVEL_KEYS=" + ($props -join ","))
              foreach ($name in @("session_id","sessionId","id","workspace","cwd","source","created_at","createdAt","timestamp")) {
                if ($props -contains $name) {
                  $value = [string]$obj.$name
                  if ($value -and $value -notmatch "(?i)apikey_|bearer|token") {
                    Write-Host ("META_" + $name + "=" + $value)
                  }
                }
              }
            } catch {
              Write-Host ("METADATA_PARSE_FAILED=" + $f.Name)
            }
          }

          Write-Host "CANDIDATE_SESSION_ID=20260917_133857_2ee3ac"

      - name: Check resume syntax only
        shell: pwsh
        run: |
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          & $hermes --help 2>&1 | Select-String -Pattern "resume|continue" -CaseSensitive:$false
