name: Hermes TypeSafe Session Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/hermes-typesafe-session.yml"

permissions:
  contents: read

concurrency:
  group: hermes-typesafe-session-discovery
  cancel-in-progress: true

jobs:
  resume-smoke:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resume original TypeSafe session and run bounded smoke
        shell: pwsh
        run: |
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          $worktree = "C:\Users\empir\Documents\antigravity\splendid-hawking"
          $session = "20260917_133857_2ee3ac"
          $prompt = 'Use the installed typesafe-ai skill and the TypeSafe credential already present in this resumed session context. Do NOT search the filesystem, history, sessions, environment, web, or other files for credentials. Do NOT print, quote, persist, or return any credential. Make exactly one live TypeSafe System One Choice request for this state: ordinary reproducible Linux build with no local desktop, device, or GPU requirement. Criteria: vds = always-on server is sufficient; lenovo = personal workstation explicitly required. Return only one compact JSON object with keys live_call, choice, confidence_available, provider, secret_exposed=false. If the credential in this session is unusable, return live_call=false and a short non-secret error_class. Do not modify files or external systems other than the single TypeSafe API request.'

          & $hermes --resume $session --no-restore-cwd --in $worktree --skills typesafe-ai -z $prompt
          if ($LASTEXITCODE -ne 0) { throw "resumed TypeSafe smoke failed" }
