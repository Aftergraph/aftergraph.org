name: Pock M8 F13 read-only artifact verification v2

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-f13-readonly-failure-diagnosis.yml

permissions: {}

jobs:
  verify:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 10
    steps:
      - name: Verify persisted F13 proof bytes and decoded guest evidence read-only on Lenovo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $probePayload = ''
          $expectedProbeSha = '0fab1327bfcd632c5eeb11db5dd5b51f6e9baa43bb01952eb9a812fcd5ba7d57'
          $contextJson = @{ workflowRunId = $env:GITHUB_RUN_ID; verifierCommitSha = $env:GITHUB_SHA } | ConvertTo-Json -Compress
          $contextEncoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($contextJson))
          $command = "import base64,gzip,hashlib,json,sys;raw=gzip.decompress(base64.b64decode('$probePayload'));actual=hashlib.sha256(raw).hexdigest();print('PROBE_SOURCE_SHA256='+actual,flush=True);assert actual=='$expectedProbeSha','probe_source_digest_mismatch';ctx=json.loads(base64.b64decode('$contextEncoded'));sys.argv=['f13-readonly-probe',json.dumps(ctx)];ns={'__name__':'__main__'};exec(compile(raw.decode('utf-8'),'<f13-readonly-verify-v2>','exec'),ns,ns)"
          & wsl.exe -d Ubuntu-26.04 -- python3 -B -u -c $command
          if ($LASTEXITCODE -ne 0) { throw "f13_readonly_verify_exit_$LASTEXITCODE" }
