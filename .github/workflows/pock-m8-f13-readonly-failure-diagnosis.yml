name: Pock M8 F13 read-only receipt verification

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-f13-readonly-failure-diagnosis.yml

permissions: {}

jobs:
  verify:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 5
    steps:
      - name: Verify persisted F13 result and raw evidence read-only on Lenovo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $probe = @'
          import base64, hashlib, json, pathlib, re, struct, zlib, sys
          run_id = "36195703803"
          root = pathlib.Path("/root/pock-m8-ci-f13-" + run_id)
          failures = []
          check_total = 0
          def check(name, ok, detail=""):
              global check_total
              check_total += 1
              status = "PASS" if ok else "FAIL"
              print("CHECK " + name + "=" + status + ((" " + str(detail)) if detail else ""), flush=True)
              if not ok:
                  failures.append(name)
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          def read_json(path, label):
              try:
                  raw = path.read_bytes()
                  value = json.loads(raw)
                  print("FILE " + label + " bytes=" + str(len(raw)) + " sha256=" + digest(raw), flush=True)
                  return value
              except Exception as exc:
                  check(label + "_read", False, type(exc).__name__)
                  return {}
          def under_root(path):
              try:
                  real = path.resolve(strict=True)
                  base = root.resolve(strict=True)
                  return real == base or base in real.parents
              except OSError:
                  return False
          def png_info(raw):
              if not raw.startswith(b"\x89PNG\r\n\x1a\n"):
                  raise ValueError("png_signature")
              pos = 8
              width = height = None
              seen_idat = False
              seen_end = False
              chunks = 0
              while pos < len(raw):
                  if pos + 12 > len(raw):
                      raise ValueError("png_truncated_chunk")
                  length = struct.unpack(">I", raw[pos:pos+4])[0]
                  kind = raw[pos+4:pos+8]
                  end = pos + 12 + length
                  if end > len(raw):
                      raise ValueError("png_truncated_data")
                  body = raw[pos+4:pos+8+length]
                  expected = struct.unpack(">I", raw[pos+8+length:end])[0]
                  if (zlib.crc32(body) & 0xffffffff) != expected:
                      raise ValueError("png_crc")
                  if chunks == 0 and kind != b"IHDR":
                      raise ValueError("png_ihdr_order")
                  if kind == b"IHDR":
                      if width is not None or length != 13:
                          raise ValueError("png_ihdr_invalid")
                      width, height = struct.unpack(">II", raw[pos+8:pos+16])
                  elif kind == b"IDAT":
                      seen_idat = True
                  elif kind == b"IEND":
                      if length != 0 or end != len(raw):
                          raise ValueError("png_iend_invalid")
                      seen_end = True
                  chunks += 1
                  pos = end
                  if seen_end:
                      break
              if width is None or height is None or width < 1 or height < 1 or width > 4096 or height > 2160:
                  raise ValueError("png_dimensions")
              if not seen_idat or not seen_end or pos != len(raw):
                  raise ValueError("png_structure")
              return width, height, chunks
          check("run_root_present", root.is_dir(), str(root))
          if not root.is_dir():
              print("F13_READONLY_VERIFICATION=FAIL", flush=True)
              raise SystemExit(2)
          ci_path = root / "CI_F13_RESULT.json"
          ex_path = root / "execution.json"
          plan_path = root / "plan.json"
          ci = read_json(ci_path, "CI_F13_RESULT.json")
          ex = read_json(ex_path, "execution.json")
          plan = read_json(plan_path, "plan.json")
          check("run_id", str(ci.get("runId")) == run_id, ci.get("runId"))
          check("result_path", ci.get("evidencePath") == str(ci_path), ci.get("evidencePath"))
          check("top_level_truth", ci.get("truthStatus") == "PRINCIPAL_F13_GUEST_BROWSER_SOFTWARE_OBSERVED", ci.get("truthStatus"))
          check("runner_truth_boundary", ci.get("runnerTruthStatus") == "PRINCIPAL_OBSERVED_PENDING_INDEPENDENT_REPRODUCTION", ci.get("runnerTruthStatus"))
          check("runner_exit", ci.get("runnerExitCode") == 0 and ci.get("failureReason") is None, ci.get("runnerExitCode"))
          check("patch_pin", ci.get("f13PatchSha256") == "8881a0822205ed218a33a9ed8bb3579993bc1fc25000568a92406adb78bc1bd9")
          check("plan_hash_chain", ci.get("canonicalPlanHash") == plan.get("planHash") == ex.get("planHash"),
                "ci=" + str(ci.get("canonicalPlanHash")) + " plan=" + str(plan.get("planHash")) + " exec=" + str(ex.get("planHash")))
          ep = ex.get("executionProof") or {}
          check("execution_proof_contract", ep.get("contract") == "HabitatMicroVMExecutionProof/v1", ep.get("contract"))
          check("execution_proof_hash_chain", ep.get("proofHash") == ci.get("executionProofHash") and
                ep.get("launchPlanHash") == plan.get("planHash"),
                "proof=" + str(ep.get("proofHash")) + " launchPlan=" + str(ep.get("launchPlanHash")))
          check("boot_hash_chain", ex.get("bootObservationHash") == ci.get("bootObservationHash") == ep.get("bootObservationHash"))
          browser = ex.get("guestBrowserProbe") or {}
          ci_browser = ci.get("guestBrowserProbe") or {}
          binding = ex.get("interactiveBindingProbe") or {}
          shutdown = ex.get("shutdown") or {}
          check("browser_truth", browser.get("contract") == "GuestBrowserProbeVerification/v1" and
                browser.get("truthStatus") == "REAL_GUEST_BROWSER_SOFTWARE_OBSERVED" and
                ci_browser.get("truthStatus") == browser.get("truthStatus"))
          check("guest_click_effect", browser.get("guestClaimedClickEffect") is True and
                browser.get("guestLocalBrowserClickEffectObserved") is True)
          check("browser_binary_fixture_pins", browser.get("browserBinarySha256") ==
                "60c03e8882f4bb47459a905ede1074e1e746c5b765e437c288e460320540a8a3" and
                browser.get("fixtureSha256") == "8bcf07dc165640fffebaf5dee0075459c8fed6dc748454de8f3f85867feb1e50")
          check("binding_hash_chain", browser.get("bindingHash") == binding.get("bindingHash") == ci_browser.get("bindingHash"))
          check("browser_execution_chain", browser.get("executionProofHash") == binding.get("executionProofHash") ==
                ci.get("executionProofHash") and browser.get("bootObservationHash") == binding.get("bootObservationHash"))
          peer = browser.get("vmmPeerIdentityHash")
          check("peer_and_shutdown_chain", peer is not None and peer == binding.get("peerIdentityHash") ==
                shutdown.get("vmmPeerIdentityHash") and shutdown.get("vmmExited") is True)
          check("guest_channel_peercred", binding.get("realGuestChannel") is True and
                browser.get("peerObservationMethod") == "SO_PEERCRED_AT_4070_ACCEPT")
          check("shutdown_request", shutdown.get("request") == "SEND_CTRL_ALT_DEL_ACCEPTED", shutdown.get("request"))
          serial_meta = ex.get("serialEvidence") or {}
          ci_serial = ci.get("serialEvidence") or {}
          serial_name = serial_meta.get("path")
          serial_path = pathlib.Path(serial_name) if serial_name else root / "execution.json.serial.log"
          check("serial_path_contained", under_root(serial_path), str(serial_path))
          serial_data = serial_path.read_bytes() if under_root(serial_path) else b""
          serial_hash = digest(serial_data)
          kernel = b"Linux version 6.18.48+" in serial_data
          init = (b"Run /sbin/init" in serial_data or b"systemd[1]: systemd " in serial_data)
          panic = b"Kernel panic" in serial_data
          check("serial_hash_chain", bool(serial_data) and serial_hash == serial_meta.get("sha256") == ci_serial.get("sha256") and
                len(serial_data) == serial_meta.get("sizeBytes") == ci_serial.get("sizeBytes"),
                "bytes=" + str(len(serial_data)) + " sha256=" + serial_hash)
          check("serial_boot_markers", kernel and init and not panic and
                serial_meta.get("kernelMarker") is True and serial_meta.get("initMarker") is True and serial_meta.get("panicMarker") is False,
                "kernel=" + str(kernel) + " init=" + str(init) + " panic=" + str(panic))
          artifacts_value = browser.get("artifactsPath") or ci_browser.get("artifactsPath")
          artifacts = pathlib.Path(artifacts_value) if artifacts_value else root / "browser-evidence"
          check("browser_artifact_path_contained", under_root(artifacts), str(artifacts))
          ready_path = artifacts / "READY.json"
          receipt_path = artifacts / "receipt.json"
          before_path = artifacts / "before.png"
          after_path = artifacts / "after.png"
          ready = read_json(ready_path, "READY.json") if under_root(ready_path) else {}
          receipt_raw = receipt_path.read_bytes() if under_root(receipt_path) else b""
          receipt = json.loads(receipt_raw) if receipt_raw else {}
          check("receipt_read", bool(receipt_raw), "bytes=" + str(len(receipt_raw)))
          before = before_path.read_bytes() if under_root(before_path) else b""
          after = after_path.read_bytes() if under_root(after_path) else b""
          before_hash, after_hash, receipt_hash = digest(before), digest(after), digest(receipt_raw)
          check("artifact_set_contract", ready.get("contract") == "GuestBrowserArtifactSet/v1")
          check("frame_and_receipt_hash_chain",
                ready.get("beforeFrameSha256") == before_hash == browser.get("beforeFrameSha256") == ci_browser.get("beforeFrameSha256") and
                ready.get("afterFrameSha256") == after_hash == browser.get("afterFrameSha256") == ci_browser.get("afterFrameSha256") and
                ready.get("receiptSha256") == receipt_hash == browser.get("receiptSha256") == ci_browser.get("receiptSha256"),
                "before=" + before_hash + " after=" + after_hash + " receipt=" + receipt_hash)
          png_ok = True
          for label, raw in (("before", before), ("after", after)):
              try:
                  width, height, chunks = png_info(raw)
                  print("PNG " + label + " sha256=" + digest(raw) + " dimensions=" + str(width) + "x" + str(height) + " chunks=" + str(chunks), flush=True)
              except Exception as exc:
                  png_ok = False
                  print("PNG " + label + " FAIL " + type(exc).__name__ + ":" + str(exc), flush=True)
          check("png_crc_dimensions", png_ok and bool(before) and bool(after))
          try:
              obs = receipt.get("observation") or {}
              receipt_before = base64.b64decode(obs["before"]["pngBase64"], validate=True)
              receipt_after = base64.b64decode(obs["after"]["pngBase64"], validate=True)
              receipt_frames_match = receipt_before == before and receipt_after == after
          except Exception as exc:
              receipt_frames_match = False
              print("RECEIPT_FRAME_DECODE_FAIL " + type(exc).__name__, flush=True)
          check("receipt_embedded_frames_match", receipt_frames_match)
          check("nonclaims_preserved", browser.get("humanTakeover") is False and
                browser.get("independentObservation") is False and browser.get("hardwareAttestation") == "BLOCKED" and
                binding.get("inputApplication") == "UNVERIFIED" and binding.get("screenProvenance") == "UNVERIFIED")
          print("LIMIT hmac_recompute=UNAVAILABLE challenge_key_nonce_not_persisted", flush=True)
          print("LIMIT human_takeover=" + str(browser.get("humanTakeover")) +
                " input_application=" + str(binding.get("inputApplication")) +
                " screen_provenance=" + str(binding.get("screenProvenance")) +
                " hardware_attestation=" + str(browser.get("hardwareAttestation")) +
                " independent_observation=" + str(browser.get("independentObservation")), flush=True)
          print("SUMMARY " + json.dumps({"runId": run_id, "checksTotal": check_total,
                "checksPassed": check_total-len(failures),
                "failures": failures, "serialSha256": serial_hash, "beforePngSha256": before_hash,
                "afterPngSha256": after_hash, "receiptSha256": receipt_hash}, sort_keys=True), flush=True)
          if failures:
              print("F13_READONLY_VERIFICATION=FAIL", flush=True)
              raise SystemExit(2)
          print("F13_READONLY_VERIFICATION=PASS", flush=True)
          '@
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($probe))
          $command = "import base64;exec(compile(base64.b64decode('$encoded'),'<f13-readonly-verification>','exec'))"
          & wsl.exe -d Ubuntu-26.04 -- python3 -B -u -c $command
          if ($LASTEXITCODE -ne 0) { throw "f13_readonly_verify_exit_$LASTEXITCODE" }
