name: Pock M8 F15 authenticated pointer input proof

on:
  push:
    branches:
      - worker/pock-m8-f15-pointer-input-20260926
    paths:
      - .github/workflows/pock-m8-f15-pointer-input.yml

permissions: {}

jobs:
  f15-execute:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 55
    steps:
      - name: Run pinned F15 pointer/ack candidate on Lenovo KVM
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }

          $items = @(
            @{ api='repos/Aftergraph/Pock-bot/contents/frontiers/m8-f11/pock-m8-f11-candidate-on-f10.patch?ref=91011a8c224bf890ccc07015df8baa26fb02b634'; filename='f11.patch' },
            @{ api='repos/Aftergraph/Pock-bot/contents/frontiers/m8-f13/pock-m8-f13-cumulative-on-f11.patch?ref=09bd63ebb7de9ca9dbb1302e8b8d9c22b629c0fa'; filename='f13.patch' },
            @{ api='repos/Aftergraph/Pock-bot/contents/frontiers/m8-f14/pock-m8-f14-on-f13.patch?ref=895444aaa2ece005282910291c8974ecf74b345b'; filename='f14.patch' },
            @{ api='repos/Aftergraph/Pock-bot/contents/frontiers/m8-f15/pock-m8-f15-on-f14.patch?ref=0df55b831ac52fed32d3038e705c2e1f1fbb8680'; filename='f15.patch' },
            @{ api='repos/Aftergraph/aftergraph.org/contents/frontiers/m8-f15/pock_m8_f15_ci_driver.py?ref=b2ae9ba253071387352610b1df1def3ae52502d4'; filename='f15-driver.py' }
          )
          $paths = @()
          try {
            foreach ($item in $items) {
              Write-Output ('FETCH_START ' + $item.filename)
              $blobJson = & gh api $item.api
              if ($LASTEXITCODE -ne 0) { throw ('fetch_failed_' + $item.filename) }
              $blob = $blobJson | ConvertFrom-Json
              if ($blob.encoding -ne 'base64') { throw ('encoding_invalid_' + $item.filename) }
              $bytes = [Convert]::FromBase64String(($blob.content -replace '\s', ''))
              $path = Join-Path $env:RUNNER_TEMP ('pock-f15-' + $env:GITHUB_RUN_ID + '-' + $item.filename)
              [IO.File]::WriteAllBytes($path, $bytes)
              $paths += $path
              Write-Output ('FETCH_PASS ' + $item.filename + ' blob=' + $blob.sha + ' bytes=' + $bytes.Length)
            }

            $linux = @($paths | ForEach-Object {
              if ($_ -notmatch '^([A-Za-z]):\\(.+)$') { throw 'runner_temp_windows_path_invalid' }
              '/mnt/' + $Matches[1].ToLowerInvariant() + '/' + $Matches[2].Replace('\', '/')
            })
            $guestTree = '/root/pock-m8-f13-gueststage-36068890418/rootfs'

            $executionId = $env:GITHUB_RUN_ID + '1'
            Write-Output ('F15_RECONSTRUCT_APPLY_TEST_BUILD_EXECUTE_START id=' + $executionId)
            & wsl.exe -d Ubuntu-26.04 -- python3 -B -u $linux[4] $executionId $linux[0] $linux[1] $linux[2] $linux[3]
            if ($LASTEXITCODE -ne 0) { throw "f15_driver_exit_$LASTEXITCODE" }
            Write-Output 'F15_GATE_PASS'
          } finally {
            foreach ($path in $paths) {
              Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue
            }
          }
