name: Materialize community launcher routing

on:
  push:
    branches: ['community/public-plane']
    paths:
      - '.github/workflows/community-launcher-sync.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: community/public-plane
      - name: Patch launcher, community registry and tests
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected pattern missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'site/launch.html',
              '{g:"Organization",n:"GitHub Organization",d:"All Aftergraph repositories and community files",u:"https://github.com/Aftergraph",b:"org"},',
              '{g:"Community",n:"Aftergraph Discussions",d:"Public research review, critique, questions and RFC formation",u:"https://github.com/orgs/Aftergraph/discussions",b:"public"},\n{g:"Community",n:"Public Roadmap",d:"Gate-driven priorities — evidence before dates",u:"https://github.com/Aftergraph/.github/blob/main/PUBLIC-ROADMAP.md",b:"public"},\n{g:"Community",n:"RFC Intake",d:"How cross-repo and normative proposals become verified changes",u:"https://github.com/orgs/Aftergraph/discussions/17",b:"public"},\n{g:"Organization",n:"GitHub Organization",d:"All Aftergraph repositories and community files",u:"https://github.com/Aftergraph",b:"org"},'
          )

          replace_once(
              'site/community.html',
              '<li><a href="https://github.com/orgs/Aftergraph/discussions/15"><code>#15</code><span>Sentinel: What Must a SHIP Verdict Prove?</span></a></li></ul>',
              '<li><a href="https://github.com/orgs/Aftergraph/discussions/15"><code>#15</code><span>Sentinel: What Must a SHIP Verdict Prove?</span></a></li><li><a href="https://github.com/orgs/Aftergraph/discussions/16"><code>#16</code><span>Aftergraph Public Roadmap: Evidence Before Dates</span></a></li><li><a href="https://github.com/orgs/Aftergraph/discussions/17"><code>#17</code><span>RFC Intake: How Aftergraph Proposals Become Changes</span></a></li></ul>'
          )
          replace_once(
              'site/community.html',
              'Seven conversations already worth attacking.',
              'Nine conversations already worth attacking.'
          )

          replace_once(
              'site/verify-v2.cjs',
              "has(launcher, 'https://docs.aftergraph.org/', 'launcher Knowledge Plane route');",
              "has(launcher, 'https://docs.aftergraph.org/', 'launcher Knowledge Plane route');\nhas(launcher, 'Aftergraph Discussions', 'launcher community destination');\nhas(launcher, 'PUBLIC-ROADMAP.md', 'launcher public roadmap destination');\nhas(launcher, 'discussions/17', 'launcher RFC intake destination');"
          )
          replace_once(
              'site/verify-v2.cjs',
              "has(communityPage, 'discussions/15', 'Sentinel verdict thread');",
              "has(communityPage, 'discussions/15', 'Sentinel verdict thread');\nhas(communityPage, 'discussions/16', 'public roadmap thread');\nhas(communityPage, 'discussions/17', 'RFC intake thread');"
          )

      - name: Regenerate and verify
        run: |
          node site/build-worker.cjs
          node site/verify-v2.cjs
          git diff --check
      - name: Commit materialized routing
        run: |
          git config user.name "aftergraph-community-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/launch.html site/community.html site/verify-v2.cjs site/worker.js site/wrangler.toml
          git commit -m "community: expose Discussions in system launcher"
          git push origin HEAD:community/public-plane
