name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  profile-interface:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect Hermes profile interface
        shell: pwsh
        run: |
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          & $hermes profile --help 2>&1 | Select-Object -First 160
          Write-Host "=== PROFILE LIST ==="
          & $hermes profile list 2>&1 | Select-Object -First 120
