name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  hermes-path:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve Hermes executables and profile
        shell: pwsh
        run: |
          foreach ($name in @("hermes","hermes-cli","hermes-agent")) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("COMMAND=" + $name + "; path=" + $cmd.Source)
            } else {
              Write-Host ("COMMAND=" + $name + "; path=ABSENT")
            }
          }

          $profile = Join-Path $HOME "AppData\Local\hermes\profiles\avc"
          Write-Host ("AVC_PROFILE=" + $profile)
          Write-Host ("AVC_PROFILE_EXISTS=" + (Test-Path -LiteralPath $profile))

          if (Test-Path -LiteralPath $profile) {
            Get-ChildItem -LiteralPath $profile -File -ErrorAction SilentlyContinue |
              Select-Object -First 80 |
              ForEach-Object { Write-Host ("PROFILE_FILE=" + $_.Name) }
          }
