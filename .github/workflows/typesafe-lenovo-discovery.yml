name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  hermes-profile:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect Hermes profile and one-shot invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $hermes = (Get-Command hermes -ErrorAction Stop).Source

          Write-Host "=== HERMES HELP ==="
          & $hermes --help 2>&1 | Select-Object -First 220

          Write-Host "=== PROFILE HELP ==="
          & $hermes profile --help 2>&1 | Select-Object -First 220

          Write-Host "=== PROFILE LIST ==="
          & $hermes profile list 2>&1 | Select-Object -First 120

          Write-Host "=== RESUME HELP ==="
          & $hermes resume --help 2>&1 | Select-Object -First 160
