name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  hermes-capability:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect Hermes CLI invocation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          foreach ($name in @("hermes","hermes-cli","hermes-agent")) {
            $cmd = Get-Command $name -ErrorAction SilentlyContinue
            if ($cmd) {
              Write-Host ("COMMAND=" + $name + "; path=" + $cmd.Source)
              & $cmd.Source --help 2>&1 | Select-Object -First 120
            }
          }

          $profile = Join-Path $HOME "AppData\Local\hermes\profiles\avc"
          Write-Host ("AVC_PROFILE_EXISTS=" + (Test-Path -LiteralPath $profile))

          $skill = Join-Path $HOME "Documents\antigravity\splendid-hawking\.agents\skills\typesafe-ai\SKILL.md"
          Write-Host ("TYPESAFE_SKILL_EXISTS=" + (Test-Path -LiteralPath $skill))
