name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Exact-path TypeSafe discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = [ordered]@{
            schema = "typesafe-lenovo-discovery/0.6"
            machine = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            env = [ordered]@{}
            roots = @()
            typesafe_skill_files = @()
            typesafe_lockfiles = @()
            credential_files = @()
          }

          foreach ($scopeName in @("Process","User","Machine")) {
            $scope = [EnvironmentVariableTarget]::$scopeName
            $value = [Environment]::GetEnvironmentVariable("TYPESAFE_API_KEY", $scope)
            $report.env["TYPESAFE_API_KEY_$scopeName"] = if ([string]::IsNullOrWhiteSpace($value)) { "ABSENT" } else { "PRESENT" }
          }

          $roots = @(
            (Join-Path $HOME "AppData\Local\hermes\profiles\avc"),
            (Join-Path $HOME ".agents"),
            (Join-Path $HOME ".codex"),
            (Join-Path $HOME ".claude"),
            (Join-Path $HOME "Documents\antigravity\splendid-hawking")
          )

          foreach ($root in $roots) {
            $exists = Test-Path -LiteralPath $root
            $report.roots += [ordered]@{ path=$root; exists=[bool]$exists }
            if (-not $exists) { continue }

            Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Length -le 1048576 -and
                $_.FullName -notmatch "(?i)\\cache\\|\\node_modules\\|\\\.git\\|\\Temp\\|\\tmp\\" -and
                (
                  $_.Name -eq "SKILL.md" -or
                  $_.Name -eq "skills-lock.json" -or
                  $_.Name -match "(?i)typesafe|jev" -or
                  $_.Name -match "(?i)^\.env" -or
                  $_.Name -match "(?i)config|settings|credential"
                )
              } |
              Select-Object -First 5000 |
              ForEach-Object {
                try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }

                if ($_.Name -eq "SKILL.md" -and $text -match "(?i)typesafe\.ai|typesafe-ai/skills|TypeSafe Agent Skills|System One API|TYPESAFE_API_KEY|\bJev\b") {
                  $report.typesafe_skill_files += $_.FullName
                }

                if ($_.Name -eq "skills-lock.json" -and $text -match "(?i)typesafe-ai/skills|typesafe-ai") {
                  $report.typesafe_lockfiles += $_.FullName
                }

                if ($text -match "(?i)TYPESAFE_API_KEY|apikey_[A-Za-z0-9_\-]{16,}") {
                  $report.credential_files += $_.FullName
                }
              }
          }

          $report.typesafe_skill_files = @($report.typesafe_skill_files | Sort-Object -Unique)
          $report.typesafe_lockfiles = @($report.typesafe_lockfiles | Sort-Object -Unique)
          $report.credential_files = @($report.credential_files | Sort-Object -Unique)

          $outDir = Join-Path $env:RUNNER_TEMP "typesafe-discovery"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outPath = Join-Path $outDir "report.json"
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $outPath -Encoding UTF8

          Write-Host "=== SAFE SUMMARY; PATHS ONLY, NO SECRET VALUES ==="
          Write-Host ("Machine=" + $report.machine)
          Write-Host ("Runner=" + $report.runner)
          foreach ($k in $report.env.Keys) { Write-Host ($k + "=" + $report.env[$k]) }
          foreach ($r in $report.roots) { Write-Host ("ROOT=" + $r.path + "; exists=" + $r.exists) }
          foreach ($p in $report.typesafe_skill_files) { Write-Host ("TYPESAFE_SKILL_FILE=" + $p) }
          foreach ($p in $report.typesafe_lockfiles) { Write-Host ("TYPESAFE_LOCKFILE=" + $p) }
          foreach ($p in $report.credential_files) { Write-Host ("TYPESAFE_CREDENTIAL_FILE=" + $p) }

      - name: Upload redacted discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-lenovo-discovery
          path: ${{ runner.temp }}\typesafe-discovery\report.json
          retention-days: 7
