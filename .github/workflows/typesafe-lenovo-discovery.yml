name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Focused Hermes and project TypeSafe discovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $report = [ordered]@{
            schema = "typesafe-lenovo-discovery/0.5"
            machine = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            env = [ordered]@{}
            hermes_skill_dirs = @()
            typesafe_skill_files = @()
            typesafe_lockfiles = @()
            credential_files = @()
            project_agent_dirs = @()
          }

          foreach ($scopeName in @("Process","User","Machine")) {
            $scope = [EnvironmentVariableTarget]::$scopeName
            $value = [Environment]::GetEnvironmentVariable("TYPESAFE_API_KEY", $scope)
            $report.env["TYPESAFE_API_KEY_$scopeName"] = if ([string]::IsNullOrWhiteSpace($value)) { "ABSENT" } else { "PRESENT" }
          }

          $hermesProfile = Join-Path $HOME "AppData\Local\hermes\profiles\avc"
          $hermesSkills = Join-Path $hermesProfile "skills"
          if (Test-Path -LiteralPath $hermesSkills) {
            Get-ChildItem -LiteralPath $hermesSkills -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { $report.hermes_skill_dirs += $_.FullName }

            Get-ChildItem -LiteralPath $hermesSkills -File -Filter "SKILL.md" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }
                if ($text -match "(?i)typesafe\.ai|typesafe-ai/skills|TYPESAFE_API_KEY|System One API|\bJev\b") {
                  $report.typesafe_skill_files += $_.FullName
                  if ($text -match "(?i)apikey_[A-Za-z0-9_\-]{16,}") {
                    $report.credential_files += $_.FullName
                  }
                }
              }
          }

          if (Test-Path -LiteralPath $hermesProfile) {
            Get-ChildItem -LiteralPath $hermesProfile -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object {
                $_.Length -le 1048576 -and
                $_.FullName -notmatch "(?i)\\cache\\|\\node_modules\\|\\\.git\\"
              } |
              Select-Object -First 6000 |
              ForEach-Object {
                try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }
                if ($text -match "(?i)TYPESAFE_API_KEY|apikey_[A-Za-z0-9_\-]{16,}") {
                  $report.credential_files += $_.FullName
                }
              }
          }

          $projectRoots = @(
            (Join-Path $HOME "Documents\antigravity"),
            (Join-Path $HOME "Documents")
          ) | Where-Object { Test-Path -LiteralPath $_ }

          foreach ($root in $projectRoots) {
            Get-ChildItem -LiteralPath $root -Directory -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @(".agents",".codex",".claude") } |
              Select-Object -First 300 |
              ForEach-Object { $report.project_agent_dirs += $_.FullName }

            Get-ChildItem -LiteralPath $root -File -Filter "skills-lock.json" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 300 |
              ForEach-Object {
                try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }
                if ($text -match "(?i)typesafe-ai/skills|typesafe-ai") {
                  $report.typesafe_lockfiles += $_.FullName
                }
              }
          }

          foreach ($agentDir in @($report.project_agent_dirs)) {
            $skillRoot = Join-Path $agentDir "skills"
            if (-not (Test-Path -LiteralPath $skillRoot)) { continue }
            Get-ChildItem -LiteralPath $skillRoot -File -Filter "SKILL.md" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 500 |
              ForEach-Object {
                try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }
                if ($text -match "(?i)typesafe\.ai|typesafe-ai/skills|TYPESAFE_API_KEY|System One API|\bJev\b") {
                  $report.typesafe_skill_files += $_.FullName
                  if ($text -match "(?i)apikey_[A-Za-z0-9_\-]{16,}") {
                    $report.credential_files += $_.FullName
                  }
                }
              }
          }

          $report.hermes_skill_dirs = @($report.hermes_skill_dirs | Sort-Object -Unique)
          $report.typesafe_skill_files = @($report.typesafe_skill_files | Sort-Object -Unique)
          $report.typesafe_lockfiles = @($report.typesafe_lockfiles | Sort-Object -Unique)
          $report.credential_files = @($report.credential_files | Sort-Object -Unique)
          $report.project_agent_dirs = @($report.project_agent_dirs | Sort-Object -Unique)

          $outDir = Join-Path $env:RUNNER_TEMP "typesafe-discovery"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outPath = Join-Path $outDir "report.json"
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $outPath -Encoding UTF8

          Write-Host "=== SAFE SUMMARY; PATHS ONLY, NO SECRET VALUES ==="
          Write-Host ("Machine=" + $report.machine)
          Write-Host ("Runner=" + $report.runner)
          foreach ($k in $report.env.Keys) { Write-Host ($k + "=" + $report.env[$k]) }
          foreach ($d in $report.hermes_skill_dirs) { Write-Host ("HERMES_SKILL_DIR=" + $d) }
          foreach ($d in $report.project_agent_dirs) { Write-Host ("PROJECT_AGENT_DIR=" + $d) }
          foreach ($p in $report.typesafe_skill_files) { Write-Host ("TYPESAFE_SKILL_FILE=" + $p) }
          foreach ($p in $report.typesafe_lockfiles) { Write-Host ("TYPESAFE_LOCKFILE=" + $p) }
          foreach ($p in $report.credential_files) { Write-Host ("TYPESAFE_CREDENTIAL_FILE=" + $p) }

      - name: Upload redacted discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-lenovo-discovery
          path: ${{ runner.temp }}\typesafe-discovery\report.json
          retention-days: 7
