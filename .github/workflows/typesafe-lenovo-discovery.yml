name: TypeSafe Jev Artifact Analysis

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: typesafe-jev-artifact-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download prior live Jev benchmark evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "ops\typesafe-proof\downloaded" | Out-Null
          gh run download 35481724805 --repo Aftergraph/aftergraph.org --name typesafe-jev-36-case-proof --dir "ops\typesafe-proof\downloaded"
          if ($LASTEXITCODE -ne 0) { throw "Artifact download failed" }

      - name: Recompute exact metrics and mismatch sets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $artifact = Get-ChildItem -LiteralPath "ops\typesafe-proof\downloaded" -File -Recurse -Filter "jev-vnext-eval.json" | Select-Object -First 1
          if (-not $artifact) { throw "Benchmark JSON not found in artifact" }

          $raw = [IO.File]::ReadAllText($artifact.FullName)
          if ($raw -match "(?i)apikey_[A-Za-z0-9_\-]{16,}|Bearer\s+[A-Za-z0-9_.\-]{16,}") {
            throw "Secret-shaped material detected in benchmark artifact"
          }

          $artifactData = $raw | ConvertFrom-Json
          $liveRows = @($artifactData.rows)

          $corpus = Get-Content -Raw -LiteralPath "ops\typesafe-proof\corpus.json" | ConvertFrom-Json
          if (@($corpus.cases).Count -ne 36) { throw "Frozen corpus must contain 36 cases" }

          $corpusIds = @($corpus.cases | ForEach-Object { [string]$_.id })
          $matchedRows = @($liveRows | Where-Object { $corpusIds -contains [string]$_.id })
          $extraRows = @($liveRows | Where-Object { $corpusIds -notcontains [string]$_.id })

          Write-Host ("artifactRows=" + $liveRows.Count)
          Write-Host ("matchedCorpusRows=" + $matchedRows.Count)
          Write-Host ("extraArtifactRows=" + $extraRows.Count)
          foreach ($extra in $extraRows) { Write-Host ("extraRowId=" + [string]$extra.id) }

          Write-Host "=== DUPLICATE ROW COUNTS ==="
          foreach ($g in @($matchedRows | Group-Object id | Where-Object { $_.Count -gt 1 })) {
            Write-Host ("duplicateId=" + $g.Name + "; count=" + $g.Count)
          }

          function Get-OriginalBaselineChoice {
            param([string]$Task,[string]$State)
            $s = $State.ToLowerInvariant()
            if ($Task -eq "placement") {
              if ($s -match "incomplete|do not say|insufficient") { return "clarify" }
              if ($s -match "windows|gpu|nvidia|desktop|usb|only exists on the user's workstation|local file") { return "lenovo" }
              return "vds"
            }
            if ($Task -eq "recovery") {
              if ($s -match "revoked|authority lease|forbidden|unauthor") { return "request_authority" }
              if ($s -match "sentinel|stale evidence|verification failed|exact-head") { return "falsify_again" }
              if ($s -match "runner offline|worker reports|environment") { return "replace_node" }
              if ($s -match "dependency|package lock|version") { return "refresh_dependency" }
              if ($s -match "invariant|assertion|logic") { return "restore_checkpoint" }
              if ($s -match "429|connection reset|timeout|retry-after") { return "retry" }
              return "halt"
            }
            if ($s -match "deterministic|single exact-head|one deterministic") { return "solo" }
            if ($s -match "critic|falsifier|adversarial") { return "critic_pair" }
            if ($s -match "claims must be merged|reduced into one evidence|source tracks") { return "fanout_reduce" }
            if ($s -match "concurrently|same time|parallel") { return "parallel" }
            return "solo"
          }

          $rows = New-Object System.Collections.ArrayList

          foreach ($case in @($corpus.cases)) {
            $matches = @($matchedRows | Where-Object { $_.id -eq $case.id })
            if ($matches.Count -lt 1) { throw ("Missing live row for " + $case.id) }

            $normalized = @()
            foreach ($m in $matches) {
              $mp = $null
              if ($null -ne $m.jevSelectedProbability) { $mp = [double]$m.jevSelectedProbability }
              elseif ($null -ne $m.selectedProbability) { $mp = [double]$m.selectedProbability }
              elseif ($null -ne $m.jevConfidence) { $mp = [double]$m.jevConfidence }

              $normalized += [pscustomobject]@{
                row = $m
                signature = (([string]$m.jevChoice) + "|" + ([string]$mp))
                probability = $mp
              }
            }

            $uniqueSignatures = @($normalized | Select-Object -ExpandProperty signature -Unique)
            if ($uniqueSignatures.Count -gt 1) {
              throw ("Conflicting duplicate Jev evidence for " + $case.id)
            }

            $jr = $normalized[0].row
            $p = $normalized[0].probability

            $baseline = Get-OriginalBaselineChoice -Task $case.task -State $case.state

            [void]$rows.Add([pscustomobject]@{
              id = [string]$case.id
              task = [string]$case.task
              expected = [string]$case.expected
              baselineChoice = $baseline
              baselineCorrect = ($baseline -eq $case.expected)
              jevChoice = [string]$jr.jevChoice
              jevCorrect = ([string]$jr.jevChoice -eq [string]$case.expected)
              probability = $p
            })
          }

          $baselineCorrect = @($rows | Where-Object baselineCorrect).Count
          $jevCorrect = @($rows | Where-Object jevCorrect).Count
          $baselineAccuracy = $baselineCorrect / 36.0
          $jevAccuracy = $jevCorrect / 36.0

          $jevFixes = @($rows | Where-Object { -not $_.baselineCorrect -and $_.jevCorrect })
          $jevBreaks = @($rows | Where-Object { $_.baselineCorrect -and -not $_.jevCorrect })
          $bothWrong = @($rows | Where-Object { -not $_.baselineCorrect -and -not $_.jevCorrect })
          $unionCorrect = @($rows | Where-Object { $_.baselineCorrect -or $_.jevCorrect }).Count

          Write-Host "=== EXACT ARTIFACT RECOMPUTE ==="
          Write-Host ("artifactRun=35481724805")
          Write-Host ("artifactId=10596260582")
          Write-Host ("rows=" + $rows.Count)
          Write-Host ("baselineCorrect=" + $baselineCorrect)
          Write-Host ("baselineAccuracy=" + $baselineAccuracy)
          Write-Host ("jevCorrect=" + $jevCorrect)
          Write-Host ("jevRawAccuracy=" + $jevAccuracy)
          Write-Host ("accuracyDeltaVsBaseline=" + ($jevAccuracy-$baselineAccuracy))
          Write-Host ("jevFixesBaselineErrors=" + $jevFixes.Count)
          Write-Host ("jevBreaksBaselineCorrect=" + $jevBreaks.Count)
          Write-Host ("bothWrong=" + $bothWrong.Count)
          Write-Host ("oracleUnionCorrect=" + $unionCorrect)
          Write-Host ("oracleUnionAccuracy=" + ($unionCorrect/36.0))
          Write-Host "outputSecretScan=clean"

          Write-Host "=== JEV FIXES BASELINE ==="
          foreach ($r in $jevFixes) {
            Write-Host ("id=" + $r.id + "; task=" + $r.task + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.probability)
          }

          Write-Host "=== JEV BREAKS BASELINE ==="
          foreach ($r in $jevBreaks) {
            Write-Host ("id=" + $r.id + "; task=" + $r.task + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.probability)
          }

          Write-Host "=== BOTH WRONG ==="
          foreach ($r in $bothWrong) {
            Write-Host ("id=" + $r.id + "; task=" + $r.task + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.probability)
          }

          Write-Host "=== CONFIDENCE-GATED HYBRIDS (IN-SAMPLE ONLY) ==="
          foreach ($t in @(0.60,0.65,0.70,0.75,0.80,0.85,0.90,0.95)) {
            $correct = 0
            $jevOverrides = 0
            foreach ($r in $rows) {
              $choice = $r.baselineChoice
              if ($null -ne $r.probability -and $r.jevChoice -ne $r.baselineChoice -and $r.probability -ge $t) {
                $choice = $r.jevChoice
                $jevOverrides++
              }
              if ($choice -eq $r.expected) { $correct++ }
            }
            Write-Host ("threshold=" + $t + "; correct=" + $correct + "; accuracy=" + ($correct/36.0) + "; jevOverrides=" + $jevOverrides)
          }

          New-Item -ItemType Directory -Force -Path "ops\typesafe-proof\artifacts" | Out-Null
          [ordered]@{
            summary = [ordered]@{
              artifactRun = 35481724805
              artifactId = 10596260582
              cases = 36
              baselineCorrect = $baselineCorrect
              baselineAccuracy = $baselineAccuracy
              jevCorrect = $jevCorrect
              jevRawAccuracy = $jevAccuracy
              accuracyDeltaVsBaseline = ($jevAccuracy-$baselineAccuracy)
              jevFixesBaselineErrors = $jevFixes.Count
              jevBreaksBaselineCorrect = $jevBreaks.Count
              bothWrong = $bothWrong.Count
              oracleUnionCorrect = $unionCorrect
              oracleUnionAccuracy = ($unionCorrect/36.0)
              outputSecretScan = "clean"
            }
            rows = $rows
          } | ConvertTo-Json -Depth 20 -Compress |
            Set-Content -LiteralPath "ops\typesafe-proof\artifacts\artifact-recompute.json" -Encoding UTF8

      - name: Upload recompute evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-jev-artifact-recompute
          path: ops/typesafe-proof/artifacts/artifact-recompute.json
          retention-days: 30
