name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  discover:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Find TypeSafe key file by path only
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $worktree = Join-Path $HOME "Documents\antigravity\splendid-hawking"
          $hermes = Join-Path $HOME "AppData\Local\hermes\profiles\avc"

          $report = [ordered]@{
            schema = "typesafe-lenovo-discovery/0.8"
            machine = $env:COMPUTERNAME
            runner = $env:RUNNER_NAME
            env = [ordered]@{}
            skill_file = (Join-Path $worktree ".agents\skills\typesafe-ai\SKILL.md")
            lock_file = (Join-Path $worktree "skills-lock.json")
            matched_files = @()
            rg_available = $false
          }

          foreach ($scopeName in @("Process","User","Machine")) {
            $scope = [EnvironmentVariableTarget]::$scopeName
            $value = [Environment]::GetEnvironmentVariable("TYPESAFE_API_KEY", $scope)
            $report.env["TYPESAFE_API_KEY_$scopeName"] = if ([string]::IsNullOrWhiteSpace($value)) { "ABSENT" } else { "PRESENT" }
          }

          $roots = @($worktree, $hermes) | Where-Object { Test-Path -LiteralPath $_ }
          $paths = New-Object System.Collections.ArrayList
          $rg = Get-Command rg -ErrorAction SilentlyContinue

          if ($rg) {
            $report.rg_available = $true
            foreach ($root in $roots) {
              $args = @(
                "-l","-i","--hidden","--no-messages",
                "--glob","!**/node_modules/**",
                "--glob","!**/.git/**",
                "--glob","!**/cache/**",
                "--glob","!**/Cache/**",
                "--glob","!**/dist/**",
                "--glob","!**/build/**",
                "TYPESAFE_API_KEY|apikey_[A-Za-z0-9_\-]{16,}",
                $root
              )
              $found = & $rg.Source @args 2>$null
              foreach ($p in @($found)) {
                if (-not [string]::IsNullOrWhiteSpace($p)) { [void]$paths.Add($p.Trim()) }
              }
            }
          } else {
            foreach ($root in $roots) {
              Get-ChildItem -LiteralPath $root -File -Recurse -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Length -le 1048576 -and
                  $_.FullName -notmatch "(?i)\\node_modules\\|\\\.git\\|\\cache\\|\\dist\\|\\build\\"
                } |
                Select-Object -First 12000 |
                ForEach-Object {
                  try { $text = [IO.File]::ReadAllText($_.FullName) } catch { return }
                  if ($text -match "(?i)TYPESAFE_API_KEY|apikey_[A-Za-z0-9_\-]{16,}") {
                    [void]$paths.Add($_.FullName)
                  }
                }
            }
          }

          foreach ($p in @($paths | Sort-Object -Unique)) {
            try { $text = [IO.File]::ReadAllText($p) } catch { continue }
            $report.matched_files += [ordered]@{
              path = $p
              mentions_env_name = [bool]($text -match "(?i)TYPESAFE_API_KEY")
              contains_key_shaped_value = [bool]($text -match "(?i)apikey_[A-Za-z0-9_\-]{16,}")
            }
          }

          $outDir = Join-Path $env:RUNNER_TEMP "typesafe-discovery"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $outPath = Join-Path $outDir "report.json"
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $outPath -Encoding UTF8

          Write-Host "=== SAFE SUMMARY; PATHS ONLY, NO SECRET VALUES ==="
          Write-Host ("Machine=" + $report.machine)
          Write-Host ("Runner=" + $report.runner)
          Write-Host ("SkillExists=" + (Test-Path -LiteralPath $report.skill_file))
          Write-Host ("SkillPath=" + $report.skill_file)
          Write-Host ("LockExists=" + (Test-Path -LiteralPath $report.lock_file))
          Write-Host ("LockPath=" + $report.lock_file)
          Write-Host ("rg_available=" + $report.rg_available)
          foreach ($k in $report.env.Keys) { Write-Host ($k + "=" + $report.env[$k]) }
          foreach ($m in $report.matched_files) {
            Write-Host ("MATCH_FILE=" + $m.path + "; envName=" + $m.mentions_env_name + "; keyShape=" + $m.contains_key_shaped_value)
          }

      - name: Upload redacted discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-lenovo-discovery
          path: ${{ runner.temp }}\typesafe-discovery\report.json
          retention-days: 7
