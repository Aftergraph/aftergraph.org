name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  install-typesafe:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install official TypeSafe skill into Hermes avc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          $url = "https://raw.githubusercontent.com/typesafe-ai/skills/main/skills/typesafe-ai/SKILL.md"

          & $hermes skills install $url --name typesafe-ai --yes
          if ($LASTEXITCODE -ne 0) { throw "TypeSafe skill install failed" }

          $listed = & $hermes skills list 2>&1
          $listed | Select-String -Pattern "typesafe|jev" -CaseSensitive:$false

          if (($listed -join "`n") -notmatch "(?i)typesafe") {
            throw "TypeSafe skill not visible after install"
          }

          Write-Host "HERMES_TYPESAFE_SKILL=INSTALLED"
