name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  hermes-skill-interface:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Inspect Hermes skill manager
        shell: pwsh
        run: |
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          & $hermes skills --help 2>&1 | Select-Object -First 180
          Write-Host "=== INSTALL HELP ==="
          & $hermes skills install --help 2>&1 | Select-Object -First 180
          Write-Host "=== SKILL LIST TYPESAFE FILTER ==="
          & $hermes skills list 2>&1 | Select-String -Pattern "typesafe|jev" -CaseSensitive:$false
