name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  typesafe-smoke:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Hermes TypeSafe live smoke proof
        shell: pwsh
        run: |
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          $worktree = "C:\Users\empir\Documents\antigravity\splendid-hawking"
          $prompt = 'Use the installed typesafe-ai skill. You are authorized to use the TypeSafe API credential previously supplied to this same local avc profile, including local profile history if needed, solely for this test. Never print, quote, echo, persist, or return the credential. Make exactly one live TypeSafe System One Choice judgment for state: ordinary reproducible Linux build, no local desktop/device/GPU requirements. Choices: vds = always-on server is sufficient; lenovo = personal workstation explicitly required. Return ONLY compact JSON with keys live_call, choice, confidence_available, provider, secret_exposed=false. Do not modify project files.'
          & $hermes --in $worktree --skills typesafe-ai -z $prompt
          if ($LASTEXITCODE -ne 0) { throw "Hermes TypeSafe live smoke failed" }
