name: TypeSafe Jev Deterministic Benchmark

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"
      - "ops/typesafe-proof/**"

permissions:
  contents: read

concurrency:
  group: typesafe-jev-deterministic-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run three live Jev batches and score deterministically
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          $worktree = "C:\Users\empir\Documents\antigravity\splendid-hawking"
          $session = "20260917_133857_2ee3ac"
          $corpusPath = Join-Path $env:GITHUB_WORKSPACE "ops\typesafe-proof\corpus.json"
          $promptPath = Join-Path $env:GITHUB_WORKSPACE "ops\typesafe-proof\benchmark-prompt.txt"

          $corpus = Get-Content -Raw -LiteralPath $corpusPath | ConvertFrom-Json
          if (@($corpus.cases).Count -ne 36) { throw "Frozen corpus must contain 36 cases" }

          $prompt = (Get-Content -Raw -LiteralPath $promptPath).Replace("{{CORPUS_PATH}}", $corpusPath)
          $raw = & $hermes --resume $session --no-restore-cwd --in $worktree --skills typesafe-ai -z $prompt
          if ($LASTEXITCODE -ne 0) { throw "Hermes live benchmark failed" }

          $joined = ($raw -join [Environment]::NewLine).Trim()
          $start = $joined.IndexOf('{')
          $end = $joined.LastIndexOf('}')
          if ($start -lt 0 -or $end -le $start) { throw "No JSON object returned by Hermes" }
          $live = $joined.Substring($start, $end - $start + 1) | ConvertFrom-Json

          if ($live.secret_exposed -ne $false) { throw "Secret exposure invariant failed" }
          $liveRows = @($live.rows)
          if ($liveRows.Count -ne 36) { throw ("Expected 36 Jev rows, got " + $liveRows.Count) }

          $ids = @($liveRows | ForEach-Object { [string]$_.id })
          if (@($ids | Sort-Object -Unique).Count -ne 36) { throw "Jev row ids must be unique" }

          function Get-BaselineChoice {
            param([string]$Task,[string]$State)
            $s = $State.ToLowerInvariant()
            if ($Task -eq "placement") {
              if ($s -match "incomplete|do not say|insufficient") { return "clarify" }
              if ($s -match "windows|gpu|nvidia|desktop|usb|only exists on the user's workstation|local file|everyday machine") { return "lenovo" }
              return "vds"
            }
            if ($Task -eq "recovery") {
              if ($s -match "revoked|authority lease|forbidden|unauthor|action grant") { return "request_authority" }
              if ($s -match "sentinel|stale evidence|verification failed|exact-head|different commit") { return "falsify_again" }
              if ($s -match "runner offline|worker reports|environment|host vanished") { return "replace_node" }
              if ($s -match "dependency|package lock|version") { return "refresh_dependency" }
              if ($s -match "invariant|assertion|logic|deterministic check fails") { return "restore_checkpoint" }
              if ($s -match "429|connection reset|timeout|retry-after") { return "retry" }
              return "halt"
            }
            if ($s -match "deterministic|single exact-head|one authoritative query") { return "solo" }
            if ($s -match "critic|falsifier|adversarial|skeptical reviewer") { return "critic_pair" }
            if ($s -match "claims must be merged|reduced into one evidence|source tracks|hypotheses.*reconciliation") { return "fanout_reduce" }
            if ($s -match "concurrently|same time|parallel|independent.*join") { return "parallel" }
            return "solo"
          }

          $rows = New-Object System.Collections.ArrayList
          foreach ($case in @($corpus.cases)) {
            $lr = @($liveRows | Where-Object { $_.id -eq $case.id })
            if ($lr.Count -ne 1) { throw ("Missing/duplicate Jev row for " + $case.id) }
            $jr = $lr[0]
            if ([string]::IsNullOrWhiteSpace([string]$jr.jevChoice)) { throw ("Missing Jev choice for " + $case.id) }
            if ($null -eq $jr.selectedProbability) { throw ("Missing Jev probability for " + $case.id) }

            $p = [double]$jr.selectedProbability
            if ($p -lt 0.0 -or $p -gt 1.0) { throw ("Invalid probability for " + $case.id) }

            $baseline = Get-BaselineChoice -Task $case.task -State $case.state
            [void]$rows.Add([pscustomobject]@{
              id = [string]$case.id
              task = [string]$case.task
              expected = [string]$case.expected
              baselineChoice = $baseline
              baselineCorrect = ($baseline -eq $case.expected)
              jevChoice = [string]$jr.jevChoice
              jevCorrect = ([string]$jr.jevChoice -eq [string]$case.expected)
              selectedProbability = $p
              acceptedAt070 = ($p -ge 0.70)
              confidenceAvailable = [bool]$jr.confidenceAvailable
            })
          }

          $baselineCorrect = @($rows | Where-Object baselineCorrect).Count
          $jevCorrect = @($rows | Where-Object jevCorrect).Count
          $accepted = @($rows | Where-Object acceptedAt070)
          $acceptedCorrect = @($accepted | Where-Object jevCorrect).Count
          $baselineAccuracy = $baselineCorrect / 36.0
          $jevAccuracy = $jevCorrect / 36.0
          $coverage = $accepted.Count / 36.0
          $acceptedAccuracy = if ($accepted.Count) { $acceptedCorrect / [double]$accepted.Count } else { 0.0 }
          $wrongRoute = if ($accepted.Count) { 1.0 - $acceptedAccuracy } else { 1.0 }

          $jevFixes = @($rows | Where-Object { -not $_.baselineCorrect -and $_.jevCorrect })
          $jevBreaks = @($rows | Where-Object { $_.baselineCorrect -and -not $_.jevCorrect })
          $bothWrong = @($rows | Where-Object { -not $_.baselineCorrect -and -not $_.jevCorrect })
          $unionCorrect = @($rows | Where-Object { $_.baselineCorrect -or $_.jevCorrect }).Count

          $thresholds = @(0.70,0.75,0.80,0.85,0.90,0.95)
          $hybrids = foreach ($t in $thresholds) {
            $correct = 0
            foreach ($r in $rows) {
              $choice = if ($r.jevChoice -ne $r.baselineChoice -and $r.selectedProbability -ge $t) { $r.jevChoice } else { $r.baselineChoice }
              if ($choice -eq $r.expected) { $correct++ }
            }
            [pscustomobject]@{ threshold=$t; correct=$correct; accuracy=($correct/36.0) }
          }

          $batchLatencies = @($live.batches | Where-Object { $null -ne $_.latencyMs } | ForEach-Object { [double]$_.latencyMs })
          $meanBatchLatency = if ($batchLatencies.Count) { ($batchLatencies | Measure-Object -Average).Average } else { $null }
          $p95BatchLatency = $null
          if ($batchLatencies.Count) {
            $sorted = @($batchLatencies | Sort-Object)
            $idx = [math]::Max(0,[math]::Ceiling($sorted.Count*0.95)-1)
            $p95BatchLatency = $sorted[$idx]
          }

          $summary = [ordered]@{
            cases = 36
            liveRequests = @($live.batches).Count
            provider = [string]$live.provider
            model = [string]$live.model
            baselineCorrect = $baselineCorrect
            baselineAccuracy = $baselineAccuracy
            jevCorrect = $jevCorrect
            jevRawAccuracy = $jevAccuracy
            acceptedCountAt070 = $accepted.Count
            jevCoverageAt070 = $coverage
            jevAcceptedAccuracyAt070 = $acceptedAccuracy
            wrongRouteRateAt070 = $wrongRoute
            accuracyDeltaVsBaseline = ($jevAccuracy-$baselineAccuracy)
            jevFixesBaselineErrors = $jevFixes.Count
            jevBreaksBaselineCorrect = $jevBreaks.Count
            bothWrong = $bothWrong.Count
            oracleUnionCorrect = $unionCorrect
            oracleUnionAccuracy = ($unionCorrect/36.0)
            meanBatchLatencyMs = $meanBatchLatency
            p95BatchLatencyMs = $p95BatchLatency
            secret_exposed = $false
          }

          Write-Host "=== DETERMINISTIC LIVE JEV BENCHMARK ==="
          foreach ($k in $summary.Keys) { Write-Host ($k + "=" + $summary[$k]) }

          Write-Host "=== JEV FIXES BASELINE ==="
          foreach ($r in $jevFixes) { Write-Host ("id=" + $r.id + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.selectedProbability) }

          Write-Host "=== JEV BREAKS BASELINE ==="
          foreach ($r in $jevBreaks) { Write-Host ("id=" + $r.id + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.selectedProbability) }

          Write-Host "=== BOTH WRONG ==="
          foreach ($r in $bothWrong) { Write-Host ("id=" + $r.id + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.selectedProbability) }

          Write-Host "=== CONFIDENCE-GATED HYBRIDS (IN-SAMPLE, NOT HOLDOUT PROOF) ==="
          foreach ($h in $hybrids) { Write-Host ("threshold=" + $h.threshold + "; correct=" + $h.correct + "; accuracy=" + $h.accuracy) }

          New-Item -ItemType Directory -Force -Path "ops\typesafe-proof\artifacts" | Out-Null
          [ordered]@{ summary=$summary; hybrids=$hybrids; rows=$rows; batches=$live.batches } |
            ConvertTo-Json -Depth 20 -Compress |
            Set-Content -LiteralPath "ops\typesafe-proof\artifacts\jev-deterministic.json" -Encoding UTF8

      - name: Upload deterministic benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-jev-deterministic-proof
          path: ops/typesafe-proof/artifacts/jev-deterministic.json
          if-no-files-found: ignore
          retention-days: 30
