name: TypeSafe Jev Holdout v1

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"
      - "ops/typesafe-proof/holdout-v1.json"
      - "ops/typesafe-proof/holdout-prompt.txt"

permissions:
  contents: read

concurrency:
  group: typesafe-jev-holdout-v1
  cancel-in-progress: true

jobs:
  holdout:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run frozen 30-case live Jev holdout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hermes = "C:\Users\empir\AppData\Local\hermes\hermes-agent\venv\Scripts\hermes.exe"
          $worktree = "C:\Users\empir\Documents\antigravity\splendid-hawking"
          $session = "20260917_133857_2ee3ac"
          $holdoutPath = Join-Path $env:GITHUB_WORKSPACE "ops\typesafe-proof\holdout-v1.json"
          $promptPath = Join-Path $env:GITHUB_WORKSPACE "ops\typesafe-proof\holdout-prompt.txt"

          $holdout = Get-Content -Raw -LiteralPath $holdoutPath | ConvertFrom-Json
          $cases = @($holdout.cases)
          if ($cases.Count -ne 30) { throw "Holdout must contain exactly 30 cases" }
          if ([double]$holdout.frozen_rule.threshold -ne 0.70) { throw "Frozen hybrid threshold changed" }
          if ($holdout.frozen_rule.mutable_after_freeze -ne $false) { throw "Holdout rule must be immutable" }

          $prompt = (Get-Content -Raw -LiteralPath $promptPath).Replace("{{HOLDOUT_PATH}}", $holdoutPath)

          $raw = & $hermes --resume $session --no-restore-cwd --in $worktree --skills typesafe-ai -z $prompt
          if ($LASTEXITCODE -ne 0) { throw "Hermes holdout execution failed" }

          $joined = ($raw -join [Environment]::NewLine).Trim()
          $start = $joined.IndexOf('{')
          $end = $joined.LastIndexOf('}')
          if ($start -lt 0 -or $end -le $start) { throw "No JSON result returned" }
          $jsonText = $joined.Substring($start, $end - $start + 1)

          if ($jsonText -match "(?i)apikey_[A-Za-z0-9_\-]{16,}|Bearer\s+[A-Za-z0-9_.\-]{16,}") {
            throw "Secret-shaped material detected in holdout output"
          }

          $live = $jsonText | ConvertFrom-Json
          if (($live.PSObject.Properties.Name -contains "secret_exposed") -and ([string]$live.secret_exposed).ToLowerInvariant() -eq "true") {
            throw "Holdout explicitly reported secret exposure"
          }

          $liveRows = @($live.rows)
          if ($liveRows.Count -ne 30) { throw ("Expected 30 live rows, got " + $liveRows.Count) }
          $uniqueIds = @($liveRows | ForEach-Object { [string]$_.id } | Sort-Object -Unique)
          if ($uniqueIds.Count -ne 30) { throw "Holdout live row ids are not unique" }

          $placementAllowed = @("vds","lenovo","clarify")
          $recoveryAllowed = @("retry","replace_node","request_authority","falsify_again","refresh_dependency","restore_checkpoint","halt")
          $topologyAllowed = @("solo","parallel","critic_pair","fanout_reduce")

          function Get-BaselineChoice {
            param([string]$Task,[string]$State)
            $s = $State.ToLowerInvariant()

            if ($Task -eq "placement") {
              if ($s -match "incomplete|do not say|insufficient|does not identify|no machine identity|does not identify the device") { return "clarify" }
              if ($s -match "windows registry|native desktop|usb webcam|only on the user's workstation|only on the operator's workstation|physically connected|encrypted project file.*only|attached device") { return "lenovo" }
              return "vds"
            }

            if ($Task -eq "recovery") {
              if ($s -match "grant expired|authority|principal does not match|no longer covered") { return "request_authority" }
              if ($s -match "different commit|independent verifier|receipt.*previous commit|stale|verification") { return "falsify_again" }
              if ($s -match "worker process disappeared|eligible healthy worker|host vanished") { return "replace_node" }
              if ($s -match "lockfile|package version|withdrawn|dependency") { return "refresh_dependency" }
              if ($s -match "deterministic invariant|prior checkpoint|logic regression") { return "restore_checkpoint" }
              if ($s -match "503|dns timeout|safe get|retry") { return "retry" }
              return "halt"
            }

            if ($s -match "one observed sha|one expected sha|deterministic schema|single answer|one authoritative query|dry-run check") { return "solo" }
            if ($s -match "adversarial reviewer|skeptical security reviewer|challenged by an independent") { return "critic_pair" }
            if ($s -match "hypotheses.*reconciled|research tracks|claims and evidence|reducer resolves conflicts") { return "fanout_reduce" }
            if ($s -match "two independent|concurrently|parallel|simple.*join|boolean join|exit statuses") { return "parallel" }
            return "solo"
          }

          $rows = New-Object System.Collections.ArrayList
          foreach ($case in $cases) {
            $matches = @($liveRows | Where-Object { [string]$_.id -eq [string]$case.id })
            if ($matches.Count -ne 1) { throw ("Missing or duplicate live result for " + $case.id) }
            $jr = $matches[0]
            $choice = [string]$jr.jevChoice
            if ([string]::IsNullOrWhiteSpace($choice)) { throw ("Missing live choice for " + $case.id) }
            if ($null -eq $jr.selectedProbability) { throw ("Missing live probability for " + $case.id) }
            $p = [double]$jr.selectedProbability
            if ($p -lt 0.0 -or $p -gt 1.0) { throw ("Invalid probability for " + $case.id) }

            $allowed = if ($case.task -eq "placement") { $placementAllowed } elseif ($case.task -eq "recovery") { $recoveryAllowed } else { $topologyAllowed }
            if ($allowed -notcontains $choice) { throw ("Jev candidate-set widening for " + $case.id + ": " + $choice) }

            $baseline = Get-BaselineChoice -Task $case.task -State $case.state
            if ($allowed -notcontains $baseline) { throw ("Baseline outside permitted set for " + $case.id) }

            $hybrid = if ($choice -ne $baseline -and $p -ge 0.70) { $choice } else { $baseline }

            [void]$rows.Add([pscustomobject]@{
              id = [string]$case.id
              task = [string]$case.task
              expected = [string]$case.expected
              baselineChoice = $baseline
              baselineCorrect = ($baseline -eq [string]$case.expected)
              jevChoice = $choice
              jevCorrect = ($choice -eq [string]$case.expected)
              probability = $p
              hybridChoice = $hybrid
              hybridCorrect = ($hybrid -eq [string]$case.expected)
              jevOverride = ($choice -ne $baseline -and $p -ge 0.70)
            })
          }

          $baselineCorrect = @($rows | Where-Object baselineCorrect).Count
          $jevCorrect = @($rows | Where-Object jevCorrect).Count
          $hybridCorrect = @($rows | Where-Object hybridCorrect).Count
          $overrides = @($rows | Where-Object jevOverride)
          $harmfulOverrides = @($overrides | Where-Object { $_.baselineCorrect -and -not $_.hybridCorrect })
          $authoritySensitiveNewErrors = @($rows | Where-Object {
            $_.task -eq "recovery" -and
            $_.expected -in @("request_authority","falsify_again") -and
            $_.baselineCorrect -and
            -not $_.hybridCorrect
          })

          $baselineAccuracy = $baselineCorrect / 30.0
          $jevAccuracy = $jevCorrect / 30.0
          $hybridAccuracy = $hybridCorrect / 30.0

          $pass = (
            $hybridAccuracy -ge $baselineAccuracy -and
            $hybridAccuracy -ge 0.90 -and
            $authoritySensitiveNewErrors.Count -eq 0 -and
            $harmfulOverrides.Count -eq 0
          )

          $summary = [ordered]@{
            schema = "jev-hybrid-holdout-v1-result/1.0"
            cases = 30
            frozenThreshold = 0.70
            provider = [string]$live.provider
            model = [string]$live.model
            baselineCorrect = $baselineCorrect
            baselineAccuracy = $baselineAccuracy
            jevCorrect = $jevCorrect
            jevAccuracy = $jevAccuracy
            hybridCorrect = $hybridCorrect
            hybridAccuracy = $hybridAccuracy
            accuracyDeltaHybridVsBaseline = ($hybridAccuracy - $baselineAccuracy)
            jevOverrides = $overrides.Count
            harmfulOverrides = $harmfulOverrides.Count
            authoritySensitiveNewErrors = $authoritySensitiveNewErrors.Count
            outputSecretScan = "clean"
            pass = $pass
          }

          Write-Host "=== FROZEN HOLDOUT V1 ==="
          foreach ($k in $summary.Keys) { Write-Host ($k + "=" + $summary[$k]) }

          Write-Host "=== HYBRID ERRORS ==="
          foreach ($r in @($rows | Where-Object { -not $_.hybridCorrect })) {
            Write-Host ("id=" + $r.id + "; task=" + $r.task + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.probability + "; hybrid=" + $r.hybridChoice)
          }

          Write-Host "=== HARMFUL OVERRIDES ==="
          foreach ($r in $harmfulOverrides) {
            Write-Host ("id=" + $r.id + "; expected=" + $r.expected + "; baseline=" + $r.baselineChoice + "; jev=" + $r.jevChoice + "; p=" + $r.probability)
          }

          New-Item -ItemType Directory -Force -Path "ops\typesafe-proof\artifacts" | Out-Null
          [ordered]@{ summary=$summary; rows=$rows } |
            ConvertTo-Json -Depth 20 -Compress |
            Set-Content -LiteralPath "ops\typesafe-proof\artifacts\holdout-v1-result.json" -Encoding UTF8

          if (-not $pass) { exit 2 }

      - name: Upload frozen holdout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typesafe-jev-hybrid-holdout-v1
          path: ops/typesafe-proof/artifacts/holdout-v1-result.json
          if-no-files-found: error
          retention-days: 30
