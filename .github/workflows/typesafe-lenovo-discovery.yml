name: TypeSafe Lenovo Discovery

on:
  push:
    branches:
      - ops/typesafe-lenovo-discovery
    paths:
      - ".github/workflows/typesafe-lenovo-discovery.yml"

permissions:
  contents: read

concurrency:
  group: typesafe-lenovo-discovery-aftergraph-org
  cancel-in-progress: true

jobs:
  check-gh:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify local GitHub CLI authority
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $gh = Get-Command gh -ErrorAction SilentlyContinue
          if (-not $gh) {
            Write-Host "GH_CLI=ABSENT"
            exit 0
          }

          Write-Host ("GH_CLI=" + $gh.Source)

          $auth = gh auth status -h github.com 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GH_AUTH=VALID"
          } else {
            Write-Host "GH_AUTH=INVALID"
          }

          gh repo view Aftergraph/runtime --json nameWithOwner,isPrivate 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "RUNTIME_REPO_ACCESS=YES"
          } else {
            Write-Host "RUNTIME_REPO_ACCESS=NO"
          }

          $help = gh secret set --help 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "GH_SECRET_SET_AVAILABLE=YES"
          } else {
            Write-Host "GH_SECRET_SET_AVAILABLE=NO"
          }
