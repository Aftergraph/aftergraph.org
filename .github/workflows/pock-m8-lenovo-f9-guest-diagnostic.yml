name: Pock M8 F9 guest receipt diagnostics read-only

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-lenovo-f9-guest-diagnostic.yml

permissions: {}

jobs:
  diagnostic:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 3
    steps:
      - name: Read bounded serial markers from the F9 guest without credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $probe = @'
          #!/usr/bin/env python3
          """Read-only bounded diagnosis of the failed guest receipt without printing secrets."""
          from pathlib import Path
          import hashlib
          import json
          import re
          
          root=Path('/root/pock-m8-ci-f9-36025190237')
          serial=root/'execution.json.serial.log'
          expected='147f91681a8feffaece01bdcae2f3919172583e027df45aa20bdfb089848b26a'
          out={'contract':'PockM8F9GuestReceiptDiagnostic/v1','runId':'36025190237'}
          if not serial.is_file() or serial.stat().st_size>16*1024*1024:
              raise RuntimeError('serial_absent_or_oversized')
          data=serial.read_bytes()
          out['serialHashMatches']=hashlib.sha256(data).hexdigest()==expected
          lines=data.decode('utf-8','replace').splitlines()
          pattern=re.compile(r'pock|workload|vsock|virtio|fail|error|python3|socket|systemd',re.I)
          redact=re.compile(r'key|token|secret|credential|password|authorization',re.I)
          matching=[{'line':i+1,'text':x.strip()[:180]} for i,x in enumerate(lines)
                    if pattern.search(x) and not redact.search(x)]
          out['matchesTotal']=len(matching)
          out['matches']=matching[-55:]
          unit=root/'source/project/scripts/build_pock_guest_workload_image.py'
          out['unitBuilderPresent']=unit.is_file()
          jail=root/'jails/firecracker/pockm8f9-36025190237/root'
          out['vsockHostPathExists']=(jail/'agent.vsock_4050').exists()
          out['jailRootPresent']=jail.is_dir()
          out['guestImagePresent']=(root/'guest-workload.ext4').is_file()
          print(json.dumps(out,sort_keys=True))
          '@
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($probe))
          $python = "import base64;exec(compile(base64.b64decode('$encoded'),'<pock-f9-guest-diagnostic>','exec'))"
          & wsl.exe -d Ubuntu-26.04 -- python3 -c $python
          if ($LASTEXITCODE -ne 0) { throw "pock_f9_guest_diagnostic_exit_$LASTEXITCODE" }
