name: Temporary public topology regeneration

on:
  push:
    branches:
      - fix/public-topology-truth

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/public-topology-truth
      - name: Reconcile landing topology literal
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'site/index.html';
          let text = fs.readFileSync(file, 'utf8');
          const before = '<span><b>21 repositories</b> · 13 public · 8 private</span>';
          const after = '<span><b>21 canonical repositories</b> · 12 public · 9 private</span>';
          if (!text.includes(before) && !text.includes(after)) {
            throw new Error('expected topology status-line literal not found');
          }
          text = text.replace(before, after);
          if (text.includes('13 public · 8 private')) {
            throw new Error('stale landing visibility totals remain');
          }
          fs.writeFileSync(file, text);
          NODE
      - name: Regenerate worker from canonical sources
        run: node site/build-worker.cjs
      - name: Commit generated source/bundle update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/index.html site/worker.js site/wrangler.toml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
            exit 0
          fi
          git commit -m 'chore(site): regenerate public topology bundle'
          git push origin HEAD:fix/public-topology-truth
