name: Pock M8 Lenovo isolated Firecracker boot

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-lenovo-boot-isolated.yml

permissions: {}

jobs:
  boot:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 6
    steps:
      - name: Reproduce isolated stock guest boot and record evidence on Lenovo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $probe = @'
          #!/usr/bin/env python3
          """Isolated CI reproduction of the stock F4 KVM boot, without private POCK source.
          
          This proves guest kernel/init and jailer lifecycle only. AF_VSOCK is disabled.
          The caller supplies a numeric GitHub run ID; all writes stay in a new /root dir.
          """
          from __future__ import annotations
          
          import fcntl
          import hashlib
          import http.client
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import socket
          import stat
          import struct
          import subprocess
          import sys
          import time
          
          KERNEL = Path('/root/pock-m8-boot/vmlinux-6.18.48')
          ROOTFS = Path('/root/pock-m8-boot/ubuntu-24.04.ext4')
          FIRECRACKER = Path('/root/pock-m8-gate/bin/firecracker')
          JAILER = Path('/root/pock-m8-gate/bin/jailer')
          PINNED = {
              KERNEL: '9204218e8bcca6ac23848d74f45df2eb19d7f31e8277840a7d145a0df8b078d2',
              ROOTFS: 'ad2f45d74a002bcbf6a0c6d0aba5d4c8e2cdf071aa30f1f1d363edc4a504b3a7',
              FIRECRACKER: '99ad0f5cd0514a88aad0e9ae8cfdb3cc3b4ab9d190e1194602406c786b5de7a5',
              JAILER: '65ef226e96f0ceda55ba643f445801ef2cc0ea667ef67cad8ac4f406c9c8434f',
          }
          
          
          def sha(path):
              h = hashlib.sha256()
              with Path(path).open('rb') as src:
                  for chunk in iter(lambda: src.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          
          def proc_state(pid):
              try:
                  fields = Path(f'/proc/{pid}/stat').read_text().rsplit(') ', 1)[1].split()
                  return fields[0], int(fields[19])
              except FileNotFoundError:
                  return None, None
          
          
          class BoundUnixHTTP(http.client.HTTPConnection):
              def __init__(self, path, expected=None):
                  super().__init__('localhost', timeout=5)
                  self.path = str(path)
                  self.expected = expected
                  self.peer = None
          
              def connect(self):
                  s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  try:
                      s.settimeout(self.timeout)
                      s.connect(self.path)
                      pid, uid, gid = struct.unpack('3i', s.getsockopt(socket.SOL_SOCKET, socket.SO_PEERCRED, 12))
                      state, ticks = proc_state(pid)
                      if pid <= 0 or ticks is None or state == 'Z':
                          raise PermissionError('firecracker_api_peer_lifecycle_unavailable')
                      if sha(f'/proc/{pid}/exe') != PINNED[FIRECRACKER]:
                          raise PermissionError('firecracker_api_peer_binary_digest_mismatch')
                      if not os.path.samefile(f'/proc/{pid}/root', Path(self.path).parent):
                          raise PermissionError('firecracker_api_peer_jail_root_mismatch')
                      self.exe_samefile_original = os.path.samefile(f'/proc/{pid}/exe', FIRECRACKER)
                      if self.expected is not None and (pid, ticks) != self.expected:
                          raise PermissionError('firecracker_api_peer_changed')
                      self.peer = (pid, ticks)
                      self.sock = s
                  except Exception:
                      s.close()
                      raise
          
          
          def api(path, method, route, data=None, expected_peer=None, audit=None):
              c = BoundUnixHTTP(path, expected=expected_peer)
              try:
                  body = None if data is None else json.dumps(data, separators=(',', ':')).encode()
                  c.request(method, route, body=body,
                            headers={'Content-Type': 'application/json'} if body is not None else {})
                  resp = c.getresponse()
                  raw = resp.read()
                  if audit is not None:
                      audit['peerExeSamefileOriginal'] = c.exe_samefile_original
                      audit['peerJailRootMatch'] = True
                  if resp.status not in ((200,) if method == 'GET' else (204,)):
                      raise RuntimeError('firecracker_api_status_' + str(resp.status))
                  return (json.loads(raw) if raw else None), c.peer
              finally:
                  c.close()
          
          
          def main():
              if len(sys.argv) != 2 or not re.fullmatch(r'[1-9][0-9]{0,14}', sys.argv[1]):
                  raise ValueError('numeric_github_run_id_required')
              run_id = sys.argv[1]
              result = {'contract': 'PockM8LenovoCIBoot/v1', 'runId': run_id,
                        'truthStatus': 'BLOCKED', 'vsockEnabled': False,
                        'networkMode': 'no-interface-deny-all'}
              root = Path('/root/pock-m8-ci-' + run_id)
              os.umask(0o077)
              proc = None
              api_path = None
              peer = None
              kernel_mode = None
              config_digest = None
              failure = None
              try:
                  if os.geteuid() != 0 or root.exists() or root.is_symlink():
                      raise RuntimeError('root_required_or_run_directory_exists')
                  fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
                  try:
                      if fcntl.ioctl(fd, 0xAE00, 0) != 12:
                          raise RuntimeError('kvm_api_version_mismatch')
                  finally:
                      os.close(fd)
                  if not Path('/sys/fs/cgroup/cgroup.controllers').is_file():
                      raise RuntimeError('cgroup_v2_unavailable')
                  for name, binary in (('firecracker', FIRECRACKER), ('jailer', JAILER)):
                      v = subprocess.run([str(binary), '--version'], capture_output=True,
                                         text=True, timeout=3, check=True).stdout
                      if 'v1.17.0' not in v:
                          raise RuntimeError(name + '_version_mismatch')
                  for path, expected in PINNED.items():
                      if sha(path) != expected:
                          raise RuntimeError(path.name + '_digest_mismatch')
                  kernel_mode = stat.S_IMODE(KERNEL.stat().st_mode)
                  vm_id = 'pockm8ci-' + run_id
                  jailroot = root / 'jails' / FIRECRACKER.name / vm_id / 'root'
                  jailroot.mkdir(parents=True, exist_ok=False)
                  staged_kernel, staged_rootfs = jailroot / 'kernel', jailroot / 'rootfs.ext4'
                  shutil.copy2(KERNEL, staged_kernel)
                  shutil.copy2(ROOTFS, staged_rootfs)
                  if sha(staged_kernel) != PINNED[KERNEL] or sha(staged_rootfs) != PINNED[ROOTFS]:
                      raise RuntimeError('staged_image_digest_mismatch')
                  if staged_kernel.stat().st_ino == KERNEL.stat().st_ino or staged_rootfs.stat().st_ino == ROOTFS.stat().st_ino:
                      raise RuntimeError('staged_image_inode_alias')
                  config = {'machine-config': {'vcpu_count': 1, 'mem_size_mib': 256},
                            'boot-source': {'kernel_image_path': '/kernel',
                                            'boot_args': 'console=ttyS0 reboot=k panic=0 pci=off'},
                            'drives': [{'drive_id': 'rootfs', 'path_on_host': '/rootfs.ext4',
                                        'is_root_device': True, 'is_read_only': False}],
                            'network-interfaces': [], 'action': {'action_type': 'InstanceStart'}}
                  config_path = jailroot / 'fc-config.json'
                  config_path.write_text(json.dumps(config, sort_keys=True) + '\n')
                  config_digest = sha(config_path)
                  serial, stderr = root / 'serial.log', root / 'jailer.stderr.log'
                  command = [str(JAILER), '--id', vm_id, '--exec-file', str(FIRECRACKER),
                             '--uid', '0', '--gid', '0', '--chroot-base-dir', str(root / 'jails'),
                             '--new-pid-ns', '--', '--config-file', '/fc-config.json',
                             '--api-sock', '/fc.sock']
                  with serial.open('xb') as serial_out, stderr.open('xb') as error_out:
                      proc = subprocess.Popen(command, stdin=subprocess.DEVNULL,
                                              stdout=serial_out, stderr=error_out)
                  api_path = jailroot / 'fc.sock'
                  deadline = time.monotonic() + 120
                  kernel_seen = init_seen = False
                  while time.monotonic() < deadline:
                      if serial.stat().st_size > 16 * 1024 * 1024:
                          raise RuntimeError('serial_exceeds_16_mib')
                      data = serial.read_bytes()
                      kernel_seen = b'Linux version 6.18.48+' in data
                      init_seen = b'Run /sbin/init' in data or b'Freeing unused kernel' in data
                      if b'Kernel panic' in data:
                          raise RuntimeError('guest_kernel_panic')
                      if kernel_seen and init_seen and api_path.is_socket():
                          break
                      time.sleep(0.2)
                  if not kernel_seen or not init_seen or not api_path.is_socket():
                      raise TimeoutError('guest_kernel_init_or_api_socket_timeout')
                  state, peer = api(api_path, 'GET', '/', audit=result)
                  if state.get('state') != 'Running':
                      raise RuntimeError('vmm_not_running')
                  result['bootObserved'] = True
              except Exception as exc:
                  failure = type(exc).__name__ + ':' + str(exc)[:180]
              finally:
                  if api_path is not None and api_path.is_socket():
                      try:
                          if peer is None:
                              _, peer = api(api_path, 'GET', '/')
                          api(api_path, 'PUT', '/actions', {'action_type': 'SendCtrlAltDel'}, expected_peer=peer)
                          result['shutdownRequest'] = 'SEND_CTRL_ALT_DEL_ACCEPTED'
                      except Exception as exc:
                          result['shutdownRequest'] = 'UNCONFIRMED:' + type(exc).__name__
                  else:
                      result['shutdownRequest'] = 'UNCONFIRMED_NO_API_SOCKET'
                  if peer is not None:
                      deadline = time.monotonic() + 20
                      while time.monotonic() < deadline:
                          state, ticks = proc_state(peer[0])
                          if ticks != peer[1] or state in (None, 'Z'):
                              result['vmmExited'] = True
                              break
                          time.sleep(0.1)
                  result.setdefault('vmmExited', False)
                  if kernel_mode is not None:
                      result['pristineKernelModePreserved'] = stat.S_IMODE(KERNEL.stat().st_mode) == kernel_mode
                  if config_digest is not None:
                      result['configSha256'] = config_digest
                      result['kernelSha256'] = PINNED[KERNEL]
                      result['rootfsSha256'] = PINNED[ROOTFS]
                  if root.exists():
                      serial = root / 'serial.log'
                      if serial.is_file() and serial.stat().st_size <= 16 * 1024 * 1024:
                          data = serial.read_bytes()
                          result['serialSha256'] = hashlib.sha256(data).hexdigest()
                          result['serialBytes'] = len(data)
                          result['kernelMarker'] = b'Linux version 6.18.48+' in data
                          result['initMarker'] = b'Run /sbin/init' in data or b'Freeing unused kernel' in data
                          result['panicMarker'] = b'Kernel panic' in data
                          result['guestRebootMarker'] = b'reboot: Restarting system' in data
                          result['vmmCleanExitMarker'] = b'Firecracker exiting successfully. exit_code=0' in data
                      stderr = root / 'jailer.stderr.log'
                      if stderr.is_file():
                          result['jailerStderrSha256'] = sha(stderr)
                      result['evidencePath'] = str(root / 'BOOT_EVIDENCE.json')
                  if failure is not None:
                      result['failure'] = failure
                  ready = (failure is None and result.get('bootObserved') and result['vmmExited']
                           and result.get('kernelMarker') and result.get('initMarker')
                           and result.get('guestRebootMarker') and result.get('vmmCleanExitMarker')
                           and not result.get('panicMarker') and result.get('pristineKernelModePreserved')
                           and result.get('shutdownRequest') == 'SEND_CTRL_ALT_DEL_ACCEPTED')
                  result['truthStatus'] = 'PRINCIPAL_CI_BOOT_OBSERVED' if ready else 'BLOCKED'
                  if root.exists():
                      with (root / 'BOOT_EVIDENCE.json').open('x') as evidence:
                          json.dump(result, evidence, sort_keys=True, indent=2)
                          evidence.write('\n')
                  public = {k: result.get(k) for k in ('contract', 'truthStatus', 'bootObserved',
                            'kernelMarker', 'initMarker', 'panicMarker', 'vmmExited',
                            'guestRebootMarker', 'vmmCleanExitMarker', 'configSha256',
                            'peerExeSamefileOriginal', 'peerJailRootMatch',
                            'shutdownRequest', 'serialSha256', 'serialBytes',
                            'pristineKernelModePreserved', 'failure')}
                  print(json.dumps(public, sort_keys=True))
              return 0 if result['truthStatus'] == 'PRINCIPAL_CI_BOOT_OBSERVED' else 2
          
          
          if __name__ == '__main__':
              raise SystemExit(main())
          '@
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($probe))
          $python = "import base64;exec(compile(base64.b64decode('$encoded'),'<pock-m8-boot>','exec'))"
          & wsl.exe -d Ubuntu-26.04 -- python3 -c $python $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "pock_m8_boot_exit_$LASTEXITCODE" }
