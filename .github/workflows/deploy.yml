name: Aftergraph Production Deploy

on:
  pull_request:
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'data/**'
      - 'scripts/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/deploy.yml'
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'data/**'
      - 'scripts/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}
  # Truth layer refresh: redeploy main with freshly read ecosystem state.
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

concurrency:
  group: aftergraph-production
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Governance topology
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Aftergraph/after-graph-governance
          ref: 7b963c880c4ccc886d4f06eb80eaf483dee848b4
          path: governance-source
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install Atlas dependencies (lockfile)
        run: npm --prefix atlas ci
      - name: Atlas unit tests
        run: npm --prefix atlas test
      - name: Front door marketing contract
        run: node --test site/front-door-v4.test.mjs
      - name: Build Atlas frontend
        run: npm --prefix atlas run build
      - name: Generate public Experience projection
        run: node atlas/scripts/generate-experience.mjs
      - name: Verify Atlas projection
        run: node site/verify-atlas.cjs
      - name: Generate governed launcher registry
        run: node scripts/generate-launcher-registry.mjs
      - name: Generate Governance platform catalog
        env:
          AFTERGRAPH_GOVERNANCE_SHA: 7b963c880c4ccc886d4f06eb80eaf483dee848b4
        run: node scripts/generate-platform-catalog.mjs governance-source
      - name: Launcher registry and telemetry contracts
        run: node --test site/launcher-registry.test.mjs site/launcher-telemetry.test.mjs
      - name: Sync canonical Brand OS inputs
        run: node scripts/sync-brand.mjs
      - name: Read live ecosystem state (truth layer)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node site/next-src/build-ecosystem-state.mjs
      - name: Compile canonical worker
        run: node site/build-worker.cjs
      - name: Launcher Worker telemetry runtime contract
        run: node --test site/launcher-worker.test.mjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Generated bundle is current
        run: git diff --exit-code -- site/wrangler.toml site/atlas-experience.json site/launcher-registry.json site/platform-catalog.json
      - name: Diff check
        run: git diff --check

  deploy:
    needs: gates
    # Manual dispatch is intentionally main-only. A convenient branch selector
    # must not become a path for deploying code that never passed the merge queue.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true') ||
      (github.event_name == 'schedule' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true')
    # Temporary fail-closed production runner while #86 tracks migration to a
    # dedicated least-privilege Cloudflare API token. The OAuth credential stays
    # on the runner and is never copied into GitHub Actions secrets.
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify production runner identity
        shell: pwsh
        run: |
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') {
            throw "unexpected production runner: $env:RUNNER_NAME"
          }
      - name: Bind deployment provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "AG_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $deployed = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "AG_DEPLOYED=$deployed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify deploy build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm --prefix atlas ci
          npm --prefix atlas test
          npm --prefix atlas run build
          node atlas/scripts/generate-experience.mjs
          node site/verify-atlas.cjs
          node scripts/generate-launcher-registry.mjs
          node --test site/launcher-registry.test.mjs site/launcher-telemetry.test.mjs
          node scripts/sync-brand.mjs
          node site/next-src/build-ecosystem-state.mjs
          node site/build-worker.cjs
          node --test site/launcher-worker.test.mjs
          node site/verify-v2.cjs
      - name: Verify deploy runner Cloudflare session
        shell: pwsh
        run: npx --yes wrangler@4.131.2 whoami
      - name: Deploy exact HEAD to Cloudflare Workers
        shell: pwsh
        working-directory: site
        run: npx --yes wrangler@4.131.2 deploy --config wrangler.toml --name aftergraph-site
      - name: Verify production exact HEAD and routes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://aftergraph.org'

          # Workers deploys propagate across the edge for a short while; poll the
          # exact-HEAD provenance instead of failing on the first stale read.
          $health = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try { $health = Invoke-RestMethod -Uri "$base/healthz?verify=$env:GITHUB_SHA&attempt=$attempt" -Method Get -Headers @{ 'Cache-Control' = 'no-cache' } } catch { $health = $null }
            if ($health -and $health.status -eq 'ok' -and $health.sha -eq $env:GITHUB_SHA) { break }
            Write-Host "attempt ${attempt}: edge still serving $($health.sha); waiting"
            Start-Sleep -Seconds 10
          }
          if (-not $health -or $health.status -ne 'ok' -or $health.sha -ne $env:GITHUB_SHA) {
            throw "health provenance mismatch after 12 attempts: expected $env:GITHUB_SHA, got $($health.sha)"
          }

          $paths = @('/', '/launch', '/launcher-app.js', '/launcher-registry.json', '/platform/catalog.json', '/status', '/sentinel', '/robots.txt', '/sitemap.xml')
          if (Select-String -Path 'site/worker.js' -Pattern "p === '/community'" -Quiet) {
            $paths += '/community'
          }

          foreach ($path in $paths) {
            $response = Invoke-WebRequest -Uri "$base${path}?verify=$env:GITHUB_SHA" -Method Get -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "smoke failed: $path -> $($response.StatusCode)" }
          }

          $telemetryCode = 0
          try {
            $response = Invoke-WebRequest -Uri "$base/api/launcher/telemetry" -Method Get -UseBasicParsing
            $telemetryCode = [int]$response.StatusCode
          } catch {
            if ($_.Exception.Response) { $telemetryCode = [int]$_.Exception.Response.StatusCode } else { throw }
          }
          if ($telemetryCode -ne 405) { throw "launcher telemetry contract failed -> $telemetryCode" }

          Write-Host "production verified at exact HEAD $env:GITHUB_SHA"

  lenovo-works-bootstrap-probe:
    name: Lenovo WORKS bootstrap probe
    if: github.event_name == 'pull_request' && github.head_ref == 'bootstrap/lenovo-works-native-20260921'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 5
    steps:
      - name: Verify exact physical runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host ('host=' + [Environment]::MachineName)
          Write-Host ('runner_name=' + $env:RUNNER_NAME)
          Write-Host ('runner_os=' + $env:RUNNER_OS)
          Write-Host ('runner_arch=' + $env:RUNNER_ARCH)
          if ([Environment]::MachineName -ne 'JONAS-LENOVO') { throw 'wrong_host' }
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'wrong_runner' }
      - name: Inspect native bootstrap prerequisites without secret values
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            "$env:LOCALAPPDATA\Aftergraph\WORKS\worker.secrets.json",
            "$env:LOCALAPPDATA\Aftergraph\WORKS\works-worker.exe",
            "C:\Aftergraph\WORKS\worker.secrets.json",
            "C:\Aftergraph\WORKS\works-worker.exe"
          )
          foreach ($p in $paths) { Write-Host ('exists ' + $p + '=' + (Test-Path -LiteralPath $p)) }
          foreach ($name in @('WORKS_API','WORKS_ENROLL_SECRET','WORKS_GITHUB_TOKEN','WORKS_POOL','WORKS_WORKER_ID')) {
            $v = [Environment]::GetEnvironmentVariable($name)
            Write-Host ($name + '_present=' + (-not [string]::IsNullOrWhiteSpace($v)))
          }
          foreach ($cmd in @('git.exe','go.exe','gh.exe','ssh.exe','tailscale.exe','cloudflared.exe')) {
            Write-Host ($cmd + '_present=' + [bool](Get-Command $cmd -ErrorAction SilentlyContinue))
          }
          foreach ($task in @('Aftergraph WORKS Worker','Hermes_Gateway','Hermes_Gateway_avc','Aftergraph-Remote-MCP')) {
            $found = Get-ScheduledTask -TaskName $task -ErrorAction SilentlyContinue
            Write-Host ('task ' + $task + '_present=' + [bool]$found)
          }
          $tcp = Test-NetConnection -ComputerName 'works.rendetalje.dk' -Port 443 -WarningAction SilentlyContinue
          Write-Host ('works_https_reachable=' + [bool]$tcp.TcpTestSucceeded)
          try {
            $r = Invoke-WebRequest -Uri 'https://works.rendetalje.dk/' -Method Head -MaximumRedirection 0 -ErrorAction Stop
            Write-Host ('works_http_status=' + [int]$r.StatusCode)
          } catch {
            if ($_.Exception.Response) { Write-Host ('works_http_status=' + [int]$_.Exception.Response.StatusCode) } else { Write-Host 'works_http_status=unreachable' }
          }
