name: Aftergraph Production Deploy

on:
  pull_request:
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/deploy.yml'
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: aftergraph-production
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install Atlas dependencies (lockfile)
        run: npm --prefix atlas ci
      - name: Atlas unit tests
        run: npm --prefix atlas test
      - name: Build Atlas frontend
        run: npm --prefix atlas run build
      - name: Generate public Experience projection
        run: node atlas/scripts/generate-experience.mjs
      - name: Verify Atlas projection
        run: node site/verify-atlas.cjs
      - name: Generate governed launcher registry
        run: node scripts/generate-launcher-registry.mjs
      - name: Launcher registry and telemetry contracts
        run: node --test site/launcher-registry.test.mjs site/launcher-telemetry.test.mjs
      - name: Sync canonical Brand OS inputs
        run: node scripts/sync-brand.mjs
      - name: Build and verify STEWARD edge assets
        run: |
          npm --prefix site/steward ci --ignore-scripts
          node site/steward/prepare-assets.cjs
          node site/steward/verify-steward.cjs build
          node --test site/steward-cloudflare-contract.test.mjs
      - name: Compile canonical worker
        run: node site/build-worker.cjs
      - name: Launcher Worker telemetry runtime contract
        run: node --test site/launcher-worker.test.mjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Generated Worker hash is current
        run: |
          actual="$(sha256sum site/worker.js | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < site/worker.sha256)"
          test "$actual" = "$expected" || { echo "worker hash drift: $actual != $expected"; exit 1; }
      - name: Generated source projections are current
        run: git diff --exit-code -- site/wrangler.toml site/atlas/ site/atlas-experience.json site/launcher-registry.json
      - name: Diff check
        run: git diff --check

  deploy:
    needs: gates
    # Manual dispatch is intentionally main-only. A convenient branch selector
    # must not become a path for deploying code that never passed the merge queue.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_DEPLOY == 'true')
    # Temporary fail-closed production runner while #86 tracks migration to a
    # dedicated least-privilege Cloudflare API token. The OAuth credential stays
    # on the runner and is never copied into GitHub Actions secrets.
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Verify production runner identity
        shell: pwsh
        run: |
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') {
            throw "unexpected production runner: $env:RUNNER_NAME"
          }
      - name: Bind deployment provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "AG_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $deployed = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "AG_DEPLOYED=$deployed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify deploy build
        run: |
          npm --prefix atlas ci
          npm --prefix atlas test
          npm --prefix atlas run build
          node atlas/scripts/generate-experience.mjs
          node site/verify-atlas.cjs
          node scripts/generate-launcher-registry.mjs
          node --test site/launcher-registry.test.mjs site/launcher-telemetry.test.mjs
          node scripts/sync-brand.mjs
          node site/build-worker.cjs
          node --test site/launcher-worker.test.mjs
          node site/verify-v2.cjs
      - name: Verify deploy runner Cloudflare session
        shell: pwsh
        run: npx --yes wrangler@4.131.2 whoami
      - name: Upload and re-verify exact STEWARD artifacts in R2
        shell: pwsh
        working-directory: site
        run: |
          $ErrorActionPreference = 'Stop'
          $bucket = 'atlas-v3-artifacts'
          $glbSha = '187819a9086b12366f33f5290db98f7921b55e0674bf4aaee000e76241cb605f'
          $zipSha = 'd10fc1d7b174630241dbde64a8cedba380e36dfaecc31ddb3bfe75d28b9b1024'
          $glbKey = "steward/v1/sha256/$glbSha/steward-rig-v1.glb"
          $zipKey = "steward/v1/sha256/$zipSha/steward-rig-v1-verified-exports.zip"
          npx --yes wrangler@4.131.2 r2 object put "$bucket/$glbKey" --file steward/dist/assets/steward-rig-v1.glb --content-type model/gltf-binary --cache-control "public, max-age=31536000, immutable" --remote
          npx --yes wrangler@4.131.2 r2 object put "$bucket/$zipKey" --file steward/dist/assets/steward-rig-v1-verified-exports.zip --content-type application/zip --content-disposition 'attachment; filename="steward-rig-v1-verified-exports.zip"' --cache-control "public, max-age=31536000, immutable" --remote
          Remove-Item steward/dist/r2-verify.glb, steward/dist/r2-verify.zip -Force -ErrorAction SilentlyContinue
          npx --yes wrangler@4.131.2 r2 object get "$bucket/$glbKey" --file steward/dist/r2-verify.glb --remote
          npx --yes wrangler@4.131.2 r2 object get "$bucket/$zipKey" --file steward/dist/r2-verify.zip --remote
          $remoteGlb = (Get-FileHash steward/dist/r2-verify.glb -Algorithm SHA256).Hash.ToLowerInvariant()
          $remoteZip = (Get-FileHash steward/dist/r2-verify.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($remoteGlb -ne $glbSha) { throw "R2 GLB SHA mismatch: $remoteGlb" }
          if ($remoteZip -ne $zipSha) { throw "R2 export-pack SHA mismatch: $remoteZip" }
          Write-Host "STEWARD_R2_VERIFY=PASS"
      - name: Deploy exact HEAD to Cloudflare Workers
        shell: pwsh
        working-directory: site
        run: npx --yes wrangler@4.131.2 deploy --config wrangler.toml --name aftergraph-site
      - name: Verify production exact HEAD and routes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://aftergraph.org'

          $health = Invoke-RestMethod -Uri "$base/healthz?verify=$env:GITHUB_SHA" -Method Get
          if ($health.status -ne 'ok' -or $health.sha -ne $env:GITHUB_SHA) {
            throw "health provenance mismatch: expected $env:GITHUB_SHA, got $($health.sha)"
          }

          $paths = @('/', '/launch', '/launcher-app.js', '/launcher-registry.json', '/status', '/sentinel', '/robots.txt', '/sitemap.xml',
            '/steward/', '/steward/app.js', '/steward/security', '/steward/evidence.json', '/steward/asset-manifest.json', '/steward/version.json',
            '/steward/vendor/three.module.js', '/steward/vendor/GLTFLoader.js')
          if (Select-String -Path 'site/worker.js' -Pattern "p === '/community'" -Quiet) {
            $paths += '/community'
          }

          foreach ($path in $paths) {
            $response = Invoke-WebRequest -Uri "$base${path}?verify=$env:GITHUB_SHA" -Method Get -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "smoke failed: $path -> $($response.StatusCode)" }
          }

          $telemetryCode = 0
          try {
            $response = Invoke-WebRequest -Uri "$base/api/launcher/telemetry" -Method Get -UseBasicParsing
            $telemetryCode = [int]$response.StatusCode
          } catch {
            if ($_.Exception.Response) { $telemetryCode = [int]$_.Exception.Response.StatusCode } else { throw }
          }
          if ($telemetryCode -ne 405) { throw "launcher telemetry contract failed -> $telemetryCode" }

          node site/steward/verify-steward.cjs live $base

          $stewardVersion = Invoke-RestMethod -Uri "$base/steward/version.json?verify=$env:GITHUB_SHA" -Method Get
          if ($stewardVersion.sha -ne $env:GITHUB_SHA) {
            throw "STEWARD provenance mismatch: expected $env:GITHUB_SHA, got $($stewardVersion.sha)"
          }

          Write-Host "production verified at exact HEAD $env:GITHUB_SHA"
