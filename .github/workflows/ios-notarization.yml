name: Aftergraph iOS Notarization Pipeline

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'ios-distribution/scripts/asc_probe.py'
      - '.github/workflows/ios-notarization.yml'
  push:
    branches:
      - 'fix/ios-notarization-release-gates'
  workflow_dispatch:
    inputs:
      upload:
        description: Upload signed build to App Store Connect
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate source layout
        run: |
          test -f ios/project.yml
          test -f ios/Aftergraph/AftergraphApp.swift
          test -f ios/Aftergraph/Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f ios-distribution/scripts/asc_probe.py
          grep -F 'PRODUCT_BUNDLE_IDENTIFIER: org.aftergraph.ios' ios/project.yml
          grep -F 'MARKETING_VERSION: "1.0.0"' ios/project.yml
          grep -F 'ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon' ios/project.yml
          python -m py_compile ios-distribution/scripts/asc_probe.py
          git diff --check

  notarize:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_PRIVATE_KEY_B64: ${{ secrets.APPLE_API_PRIVATE_KEY_B64 }}
      BUILD_NUMBER: ${{ github.run_number }}
      MARKETING_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify Apple credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in APPLE_TEAM_ID APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_API_PRIVATE_KEY_B64; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              missing=1
            fi
          done
          exit $missing

      - name: Select supported Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install 'PyJWT[crypto]==2.10.1'
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Materialize App Store Connect key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_B64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Probe App Store Connect app record
        shell: bash
        run: |
          python3 ios-distribution/scripts/asc_probe.py --bundle-id org.aftergraph.ios

      - name: Generate deterministic app icons
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, struct, zlib
          out="ios/Aftergraph/Assets.xcassets/AppIcon.appiconset"
          os.makedirs(out,exist_ok=True)
          specs={
            "Icon-20@2x.png":40,"Icon-20@3x.png":60,"Icon-29@2x.png":58,"Icon-29@3x.png":87,
            "Icon-40@2x.png":80,"Icon-40@3x.png":120,"Icon-60@2x.png":120,"Icon-60@3x.png":180,
            "Icon-20@1x-ipad.png":20,"Icon-20@2x-ipad.png":40,"Icon-29@1x-ipad.png":29,"Icon-29@2x-ipad.png":58,
            "Icon-40@1x-ipad.png":40,"Icon-40@2x-ipad.png":80,"Icon-76@1x.png":76,"Icon-76@2x.png":152,
            "Icon-83.5@2x.png":167,"Icon-1024.png":1024
          }
          def chunk(t,d): return struct.pack(">I",len(d))+t+d+struct.pack(">I",zlib.crc32(t+d)&0xffffffff)
          def png(path,n):
              rows=[]
              cx=(n-1)/2; cy=(n-1)/2; radius=n*0.27
              for y in range(n):
                  row=bytearray([0])
                  for x in range(n):
                      dx=abs(x-cx); dy=abs(y-cy)
                      bg=(7,10,15,255)
                      fg=(245,248,252,255)
                      px=fg if (dx+dy)<radius else bg
                      row.extend(px)
                  rows.append(bytes(row))
              raw=b"".join(rows)
              data=b"\x89PNG\r\n\x1a\n"+chunk(b"IHDR",struct.pack(">IIBBBBB",n,n,8,6,0,0,0))+chunk(b"IDAT",zlib.compress(raw,9))+chunk(b"IEND",b"")
              open(path,"wb").write(data)
          for name,n in specs.items(): png(os.path.join(out,name),n)
          print("generated",len(specs),"icons")
          PY

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Archive with Apple cloud signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild             -project ios/Aftergraph.xcodeproj             -scheme Aftergraph             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/Aftergraph.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Automatic             MARKETING_VERSION="$MARKETING_VERSION"             CURRENT_PROJECT_VERSION="$BUILD_NUMBER"             -allowProvisioningUpdates             -authenticationKeyPath "$APPLE_API_KEY_PATH"             -authenticationKeyID "$APPLE_API_KEY_ID"             -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"             archive

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          mkdir -p "$RUNNER_TEMP/export"
          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/Aftergraph.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"             -allowProvisioningUpdates             -authenticationKeyPath "$APPLE_API_KEY_PATH"             -authenticationKeyID "$APPLE_API_KEY_ID"             -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          test -f "$RUNNER_TEMP/export/Aftergraph.ipa"
          shasum -a 256 "$RUNNER_TEMP/export/Aftergraph.ipa"

      - name: Validate signed IPA locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa"
          cd "$RUNNER_TEMP/ipa"
          unzip -q "$RUNNER_TEMP/export/Aftergraph.ipa"
          codesign --verify --deep --strict --verbose=2 Payload/Aftergraph.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Aftergraph.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Aftergraph.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Aftergraph.app/Info.plist

      - name: Validate with App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool             --validate-app             --type ios             --file "$RUNNER_TEMP/export/Aftergraph.ipa"             --apiKey "$APPLE_API_KEY_ID"             --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Upload build to App Store Connect
        if: github.event_name == 'push' || inputs.upload
        shell: bash
        run: |
          set -euo pipefail
          xcrun altool             --upload-app             --type ios             --file "$RUNNER_TEMP/export/Aftergraph.ipa"             --apiKey "$APPLE_API_KEY_ID"             --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Wait for exact App Store Connect build
        if: github.event_name == 'push' || inputs.upload
        shell: bash
        run: |
          python3 ios-distribution/scripts/asc_probe.py             --bundle-id org.aftergraph.ios             --wait-build             --build "$BUILD_NUMBER"             --timeout 1200

      - name: Upload signed build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Aftergraph-iOS-signed-evidence
          path: |
            ${{ runner.temp }}/export/Aftergraph.ipa
            ${{ runner.temp }}/ExportOptions.plist
          if-no-files-found: error
          retention-days: 14
