name: Aftergraph V2 Interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/v2-interface.yml'
  push:
    branches:
      - 'feat/aftergraph-v2-implementation'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile worker
        run: node site/build-worker.cjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit generated worker on implementation branch
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- site/worker.js site/wrangler.toml; then
            echo "Generated worker already current"
            exit 0
          fi
          git config user.name "aftergraph-v2-ci"
          git config user.email "actions@users.noreply.github.com"
          git add site/worker.js site/wrangler.toml
          git commit -m "build(site): regenerate V2 worker [skip ci]"
          git push
