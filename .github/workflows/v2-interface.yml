name: Aftergraph V2 Interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/v2-interface.yml'
  push:
    branches:
      - 'main'
      - 'feat/aftergraph-v2-implementation'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile worker
        run: node site/build-worker.cjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Generated bundle is current
        run: git diff --exit-code -- site/worker.js site/wrangler.toml
      - name: Diff check
        run: git diff --check
