name: Aftergraph V2 Interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'atlas/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/v2-interface.yml'
  push:
    branches:
      - 'main'
      - 'feat/aftergraph-v2-implementation'
      - 'feat/atlas'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install Atlas dependencies (lockfile)
        run: npm --prefix atlas ci
      - name: Audit Atlas dependencies
        run: npm --prefix atlas audit --audit-level=moderate
      - name: Atlas unit tests
        run: npm --prefix atlas test
      - name: Atlas projection tests
        run: node --test site/atlas-projection.test.mjs
      - name: Build Atlas frontend
        run: npm --prefix atlas run build
      - name: Generate public Experience projection
        run: node atlas/scripts/generate-experience.mjs
      - name: Verify Atlas projection
        run: node site/verify-atlas.cjs
      - name: Generate governed launcher registry
        run: node scripts/generate-launcher-registry.mjs
      - name: Launcher registry and telemetry contracts
        run: node --test site/launcher-registry.test.mjs site/launcher-telemetry.test.mjs
      - name: Sync canonical Brand OS inputs
        run: node scripts/sync-brand.mjs
      - name: Build and verify STEWARD edge assets
        run: |
          npm --prefix site/steward ci --ignore-scripts
          node site/steward/prepare-assets.cjs
          node site/steward/verify-steward.cjs build
          node --test site/steward-cloudflare-contract.test.mjs
      - name: Compile worker
        run: node site/build-worker.cjs
      - name: Worker runtime contracts
        run: node --test site/launcher-worker.test.mjs site/steward-worker.test.mjs
      - name: Install Playwright chromium
        run: npx --prefix atlas playwright install --with-deps chromium
      - name: Atlas browser smoke (DOM)
        run: |
          node site/serve-local.cjs 8471 site &
          SRV=$!
          node atlas/scripts/verify-dom.mjs "http://localhost:8471/atlas/"
          STATUS=$?
          kill $SRV
          exit $STATUS
      - name: Launcher browser smoke
        run: |
          node site/serve-local.cjs 8472 site &
          SRV=$!
          node atlas/scripts/verify-launcher.mjs "http://localhost:8472/launch.html"
          STATUS=$?
          kill $SRV
          exit $STATUS
      - name: Community browser smoke
        run: |
          node site/serve-local.cjs 8473 site &
          SRV=$!
          node atlas/scripts/verify-community.mjs "http://localhost:8473/community"
          STATUS=$?
          kill $SRV
          exit $STATUS
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Generated Worker hash is current
        run: |
          actual="$(sha256sum site/worker.js | awk '{print $1}')"
          expected="$(tr -d '[:space:]' < site/worker.sha256)"
          test "$actual" = "$expected" || { echo "worker hash drift: $actual != $expected"; exit 1; }
      - name: Generated source projections are current
        run: git diff --exit-code -- site/wrangler.toml site/atlas/ site/atlas-experience.json site/launcher-registry.json
      - name: Diff check
        run: git diff --check
