name: Aftergraph V2 Interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/v2-interface.yml'
  push:
    branches:
      - 'main'
      - 'feat/aftergraph-v2-implementation'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply latest main P3 integration
        run: |
          node site/apply-main20-21.cjs
          rm site/apply-main20-21.cjs
      - name: Compile worker
        run: node site/build-worker.cjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit integrated sources and bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site .github/workflows/v2-interface.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(site): integrate context packs and private-link boundary"
            git push
          fi
      - name: Generated bundle is current
        run: git diff --exit-code -- site/worker.js site/wrangler.toml
