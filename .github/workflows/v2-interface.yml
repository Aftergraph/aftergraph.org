name: Aftergraph V2 Interface

on:
  pull_request:
    paths:
      - 'site/**'
      - 'DEPLOYMENT.md'
      - '.github/workflows/v2-interface.yml'
  push:
    branches:
      - 'feat/aftergraph-v2-implementation'

permissions:
  contents: write

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Apply staged integration fixup
        run: |
          if [ -f site/apply-v2-fixes.cjs ]; then
            node site/apply-v2-fixes.cjs
            rm site/apply-v2-fixes.cjs
          fi
      - name: Compile worker
        run: node site/build-worker.cjs
      - name: Verify V2 contract
        run: node site/verify-v2.cjs
      - name: Diff check
        run: git diff --check
      - name: Commit resolved sources and generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- DEPLOYMENT.md site .github/workflows/v2-interface.yml
          if ! git diff --cached --quiet; then
            git commit -m "fix(site): integrate public status and launcher accessibility"
            git push
          fi
      - name: Generated bundle is current
        run: git diff --exit-code -- site/worker.js site/wrangler.toml
