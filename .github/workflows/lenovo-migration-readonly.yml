name: Lenovo migration read-only probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lenovo-migration-readonly-${{ github.sha }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 10
    steps:
      - name: Verify Lenovo runner identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ne 'JONAS-LENOVO') {
            throw "unexpected host: $env:COMPUTERNAME"
          }
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') {
            throw "unexpected runner: $env:RUNNER_NAME"
          }

      - name: Inspect migration and runner state without mutation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Users\empir\Aftergraph\_migration'
          $summaryPath = Join-Path $env:RUNNER_TEMP 'lenovo-migration-readonly-summary.json'
          $verifyOut = Join-Path $env:RUNNER_TEMP 'migration-verify-phase3.txt'

          function Describe-Path([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) {
              return [ordered]@{ exists = $false; path = $Path }
            }
            $item = Get-Item -LiteralPath $Path -Force
            return [ordered]@{
              exists = $true
              path = $Path
              attributes = [string]$item.Attributes
              link_type = [string]$item.LinkType
              target = @($item.Target)
              last_write_utc = $item.LastWriteTimeUtc.ToString('o')
            }
          }

          function Describe-File([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return [ordered]@{ exists = $false; path = $Path }
            }
            $item = Get-Item -LiteralPath $Path -Force
            return [ordered]@{
              exists = $true
              path = $Path
              size = $item.Length
              sha256 = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash.ToLowerInvariant()
              last_write_utc = $item.LastWriteTimeUtc.ToString('o')
            }
          }

          function Describe-Runner([string]$RunnerRoot) {
            $out = [ordered]@{
              root = $RunnerRoot
              exists = (Test-Path -LiteralPath $RunnerRoot)
              registration = $null
              service = $null
            }
            if (-not $out.exists) { return $out }

            $runnerFile = Join-Path $RunnerRoot '.runner'
            if (Test-Path -LiteralPath $runnerFile -PathType Leaf) {
              try {
                $j = Get-Content -LiteralPath $runnerFile -Raw | ConvertFrom-Json
                $url = $null
                foreach ($field in @('gitHubUrl','githubUrl','url')) {
                  if ($j.PSObject.Properties.Name -contains $field) {
                    $candidate = [string]$j.$field
                    if ($candidate) { $url = $candidate; break }
                  }
                }
                $out.registration = [ordered]@{
                  agent_name = if ($j.PSObject.Properties.Name -contains 'agentName') { [string]$j.agentName } else { $null }
                  url = $url
                }
              } catch {
                $out.registration = [ordered]@{ error = 'invalid_runner_json' }
              }
            }

            $serviceFile = Join-Path $RunnerRoot '.service'
            if (Test-Path -LiteralPath $serviceFile -PathType Leaf) {
              $serviceName = (Get-Content -LiteralPath $serviceFile -Raw).Trim()
              $svc = Get-CimInstance Win32_Service -Filter ("Name='" + $serviceName.Replace("'","''") + "'") -ErrorAction SilentlyContinue
              $out.service = [ordered]@{
                name = $serviceName
                exists = ($null -ne $svc)
                state = if ($svc) { [string]$svc.State } else { $null }
                start_mode = if ($svc) { [string]$svc.StartMode } else { $null }
              }
            }
            return $out
          }

          $summary = [ordered]@{
            probe_version = 'lenovo-migration-readonly/1.0'
            mutation_performed = $false
            machine = [ordered]@{
              computer_name = $env:COMPUTERNAME
              user_name = $env:USERNAME
              runner_name = $env:RUNNER_NAME
              runner_os = $env:RUNNER_OS
              runner_arch = $env:RUNNER_ARCH
            }
            migration_root = Describe-Path $root
            files = [ordered]@{}
            inventory = [ordered]@{}
            canonical_tsv = [ordered]@{}
            lease_state = [ordered]@{}
            tooling = [ordered]@{}
            paths = [ordered]@{}
            processes = @()
            action_runners = [ordered]@{}
            listener_processes = @()
            verify_phase3 = [ordered]@{
              attempted = $false
              exit_code = $null
              bash = $null
              output_file = $verifyOut
            }
          }

          foreach ($name in @(
            'HANDOFF.md',
            'README.md',
            'inventory.json',
            'phase3-manifest.json',
            'archive-manifest.json',
            'junction-pairs.tsv',
            'canonical.tsv',
            'secondary.tsv',
            'lease',
            'finish-consolidation.py',
            'verify-phase3.sh',
            'prune-exec-log.txt',
            'repair-log.txt'
          )) {
            $summary.files[$name] = Describe-File (Join-Path $root $name)
          }

          $inventoryPath = Join-Path $root 'inventory.json'
          if (Test-Path -LiteralPath $inventoryPath -PathType Leaf) {
            $raw = Get-Content -LiteralPath $inventoryPath -Raw
            $canonical = @(
              'afm','after-graph-governance','aftergraph-cron-fabric','aftergraph.org','aie',
              'autonomous-venture-company','brand','business-ops','context-continuity','continuum',
              'docs','fihim','intelligence-systems-research','llm-research-development','model-registry',
              'relay','rendetalje','renos','runtime','sentinel','skill-abi','skillport','skills-vault',
              'studio','trust-gateway','veranza','war-room','wi-backend','wi-frontend','works-execution'
            )
            $exceptions = @('.github','sentinel-firetest','sentinel-firetest2')
            $present = @($canonical | Where-Object { $raw -match [regex]::Escape($_) })
            $missing = @($canonical | Where-Object { $raw -notmatch [regex]::Escape($_) })
            $exceptionPresent = @($exceptions | Where-Object { $raw -match [regex]::Escape($_) })
            $summary.inventory = [ordered]@{
              canonical_expected = $canonical.Count
              canonical_present_by_name_scan = $present.Count
              canonical_missing_by_name_scan = $missing
              exception_names_present = $exceptionPresent
            }
          }

          $canonicalTsvPath = Join-Path $root 'canonical.tsv'
          if (Test-Path -LiteralPath $canonicalTsvPath -PathType Leaf) {
            $canonicalLines = @(Get-Content -LiteralPath $canonicalTsvPath | Where-Object { $_.Trim() -and -not $_.TrimStart().StartsWith('#') })
            $summary.canonical_tsv = [ordered]@{
              line_count = $canonicalLines.Count
              first_fields = @($canonicalLines | ForEach-Object { ($_ -split "`t")[0] })
            }
          }

          $leasePath = Join-Path $root 'lease'
          if (Test-Path -LiteralPath $leasePath -PathType Leaf) {
            try {
              $leaseJson = Get-Content -LiteralPath $leasePath -Raw | ConvertFrom-Json
              $leaseOut = [ordered]@{}
              foreach ($field in @('holder','phase','heartbeat','heartbeat_at','updated_at','lock_holders','expires_at','status')) {
                if ($leaseJson.PSObject.Properties.Name -contains $field) {
                  $leaseOut[$field] = $leaseJson.$field
                }
              }
              $summary.lease_state = $leaseOut
            } catch {
              $summary.lease_state = [ordered]@{ parse_error = $true }
            }
          }

          $summary.paths = [ordered]@{
            canonical_fihim = Describe-Path 'C:\Users\empir\Aftergraph\repos\fihim'
            legacy_fihim = Describe-Path 'C:\Users\empir\Documents\antigravity\splendid-hawking'
            canonical_skillport = Describe-Path 'C:\Users\empir\Aftergraph\repos\skillport'
            legacy_skillport = Describe-Path 'C:\Users\empir\workspace\skillport'
            wt_abc = Describe-Path 'C:\Users\empir\Aftergraph\wt\abc'
          }

          foreach ($procId in @(17992,26752,10016,34156,9152)) {
            $p = Get-CimInstance Win32_Process -Filter "ProcessId = $procId" -ErrorAction SilentlyContinue
            if ($null -eq $p) {
              $summary.processes += [ordered]@{ pid = $procId; exists = $false }
              continue
            }
            $cmd = [string]$p.CommandLine
            $summary.processes += [ordered]@{
              pid = $procId
              exists = $true
              name = [string]$p.Name
              executable = [string]$p.ExecutablePath
              mentions_zcode = $cmd -match '(?i)zcode'
              mentions_hermes = $cmd -match '(?i)hermes'
              mentions_splendid_hawking = $cmd -match '(?i)splendid-hawking'
              mentions_skillport = $cmd -match '(?i)skillport'
              mentions_resume_marker = $cmd -match '20260917_133857'
              mentions_worktrees = $cmd -match '(?i)\.worktrees'
            }
          }

          $runnerRoots = @()
          $aftergraphLocal = 'C:\Users\empir\AppData\Local\Aftergraph'
          if (Test-Path -LiteralPath $aftergraphLocal) {
            $runnerRoots += @(Get-ChildItem -LiteralPath $aftergraphLocal -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -like 'actions-runner-*' } |
              ForEach-Object { $_.FullName })
          }
          foreach ($candidate in @(
            'C:\Aftergraph\JAR-EXP-0013\actions-runner',
            'C:\Aftergraph\aftergraph-site-deploy\actions-runner',
            'C:\Aftergraph\actions-runner',
            'C:\actions-runner'
          )) {
            if (Test-Path -LiteralPath $candidate) { $runnerRoots += $candidate }
          }
          foreach ($runnerRoot in @($runnerRoots | Sort-Object -Unique)) {
            $summary.action_runners[$runnerRoot] = Describe-Runner $runnerRoot
          }

          $listeners = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" -ErrorAction SilentlyContinue)
          foreach ($listener in $listeners) {
            $exe = [string]$listener.ExecutablePath
            $summary.listener_processes += [ordered]@{
              pid = [int]$listener.ProcessId
              executable = $exe
              under_isr_runner = ($exe -and $exe.ToLowerInvariant().StartsWith('c:\aftergraph\jar-exp-0013\actions-runner'))
              under_site_runner = ($exe -and $exe.ToLowerInvariant().Contains('aftergraph-site-deploy'))
            }
          }

          $verifyScript = Join-Path $root 'verify-phase3.sh'
          if (Test-Path -LiteralPath $verifyScript -PathType Leaf) {
            $gitSources = @((Get-Command git.exe -All -ErrorAction SilentlyContinue | ForEach-Object { $_.Source }) | Sort-Object -Unique)
            $bashSources = @((Get-Command bash.exe -All -ErrorAction SilentlyContinue | ForEach-Object { $_.Source }) | Sort-Object -Unique)
            $bashCandidates = @(
              'C:\Program Files\Git\bin\bash.exe',
              'C:\Program Files\Git\usr\bin\bash.exe',
              'C:\Users\empir\AppData\Local\Programs\Git\bin\bash.exe',
              'C:\Users\empir\AppData\Local\Programs\Git\usr\bin\bash.exe'
            )
            foreach ($gitSource in $gitSources) {
              $gitDir = Split-Path -Parent $gitSource
              $gitRoot = Split-Path -Parent $gitDir
              $bashCandidates += (Join-Path $gitRoot 'bin\bash.exe')
              $bashCandidates += (Join-Path $gitRoot 'usr\bin\bash.exe')
            }
            $bash = @($bashCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1)
            if ($bash.Count -gt 0) { $bash = [string]$bash[0] } else { $bash = $null }

            $summary.tooling = [ordered]@{
              git_sources = $gitSources
              bash_command_sources = $bashSources
              selected_bash = $bash
            }

            if ($bash) {
              $summary.verify_phase3.attempted = $true
              $summary.verify_phase3.bash = $bash
              & $bash 'C:/Users/empir/Aftergraph/_migration/verify-phase3.sh' 2>&1 |
                Tee-Object -FilePath $verifyOut
              $verifyCode = $LASTEXITCODE
              $summary.verify_phase3.exit_code = $verifyCode
              $global:LASTEXITCODE = 0
            }
          }

          $summary | ConvertTo-Json -Depth 9 | Set-Content -LiteralPath $summaryPath -Encoding UTF8
          Write-Host '=== LENOVO MIGRATION READ-ONLY SUMMARY ==='
          Get-Content -LiteralPath $summaryPath
          Write-Host '=== END SUMMARY ==='

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lenovo-migration-readonly-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/lenovo-migration-readonly-summary.json
            ${{ runner.temp }}/migration-verify-phase3.txt
          if-no-files-found: warn
          retention-days: 7
