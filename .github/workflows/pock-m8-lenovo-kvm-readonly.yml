name: Pock M8 Lenovo KVM read-only admission

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-lenovo-kvm-readonly.yml

permissions: {}

jobs:
  admit:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 6
    steps:
      - name: Read nested KVM and pinned Firecracker pair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') {
            throw 'unexpected_runner'
          }
          $probe = @'
          import fcntl
          import json
          import os
          import subprocess
          import sys

          result = {'contract': 'PockM8LenovoKVMReadOnly/v1', 'kvmApiVersion': None,
                    'unknownCap': None, 'firecrackerVersion': None,
                    'jailerVersion': None, 'cgroupV2': False}
          try:
              fd = os.open('/dev/kvm', os.O_RDWR | os.O_CLOEXEC)
              try:
                  result['kvmApiVersion'] = int(fcntl.ioctl(fd, 0xAE00, 0))
                  result['unknownCap'] = int(fcntl.ioctl(fd, 0xAE03, 0xffff))
              finally:
                  os.close(fd)
          except OSError as exc:
              result['kvmError'] = type(exc).__name__

          for name in ('firecracker', 'jailer'):
              path = '/root/pock-m8-gate/bin/' + name
              if os.path.isfile(path) and os.access(path, os.X_OK):
                  try:
                      line = subprocess.run([path, '--version'], capture_output=True,
                                            text=True, check=True, timeout=3).stdout.splitlines()[0]
                      result[name + 'Version'] = '1.17.0' if 'v1.17.0' in line else 'OTHER'
                  except (OSError, IndexError, subprocess.SubprocessError):
                      result[name + 'Version'] = 'ERROR'
          result['cgroupV2'] = os.path.isfile('/sys/fs/cgroup/cgroup.controllers')
          ready = (result['kvmApiVersion'] == 12 and result['unknownCap'] == 0
                   and result['firecrackerVersion'] == '1.17.0'
                   and result['jailerVersion'] == '1.17.0' and result['cgroupV2'])
          result['truthStatus'] = 'HOST_READONLY_ADMITTED' if ready else 'BLOCKED'
          print(json.dumps(result, sort_keys=True))
          sys.exit(0 if ready else 2)
          '@
          $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes($probe))
          $python = "import base64;exec(compile(base64.b64decode('$encoded'),'<pock-m8-probe>','exec'))"
          & wsl.exe -d Ubuntu-26.04 -- python3 -c $python
          if ($LASTEXITCODE -ne 0) { throw "pock_m8_readonly_probe_exit_$LASTEXITCODE" }
