name: Pock M8 F13 private guest browser proof

on:
  push:
    branches:
      - worker/pock-m8-lenovo-kvm-readonly-20260924
    paths:
      - .github/workflows/pock-m8-lenovo-f13-execute.yml

permissions: {}

jobs:
  f13-execute:
    if: github.repository == 'Aftergraph/aftergraph.org' && github.actor == 'JonasAbde'
    runs-on: [self-hosted, Windows, X64, aftergraph-site-deploy]
    timeout-minutes: 25
    steps:
      - name: Run pinned private F13 source and browser image on Lenovo
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_NAME -ne 'lenovo-aftergraph-site-deploy') { throw 'unexpected_runner' }
          $privateRef = 'worker/m8-f13-browser-protocol-20260924'
          $items = @(
            @{ api='repos/Aftergraph/Pock-bot/contents/frontiers/m8-f11/pock-m8-f11-candidate-on-f10.patch?ref=worker/m8-f11-interactive-binding-20260924'; digest='f22ece3e4563efc6b7cc0ad772d912ee3484364381d9b1f425277108aa1f964b'; filename='f11.patch' },
            @{ api=('repos/Aftergraph/Pock-bot/contents/frontiers/m8-f13/pock-m8-f13-cumulative-on-f11.patch?ref=' + $privateRef); digest='7ba9ed271738e5fffa5095bbab8e7912b49e2450d182786375cc7e6ff8f48553'; filename='f13.patch' },
            @{ api=('repos/Aftergraph/Pock-bot/contents/frontiers/m8-f13/pock_m8_lenovo_f13_execute.py?ref=' + $privateRef); digest='d0584439ca8affe554f198d373cb153b1b7f194461d8ccf956ce5ad70abd2520'; filename='f13-runner.py' }
          )
          $paths = @()
          try {
            foreach ($item in $items) {
              $blobJson = $null
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                $stdout = Join-Path $env:RUNNER_TEMP ('pock-fetch-' + $env:GITHUB_RUN_ID + '-' + $item.filename + '.out')
                $stderr = Join-Path $env:RUNNER_TEMP ('pock-fetch-' + $env:GITHUB_RUN_ID + '-' + $item.filename + '.err')
                Remove-Item -LiteralPath $stdout, $stderr -Force -ErrorAction SilentlyContinue
                Write-Output ('FETCH_START ' + $item.filename + ' attempt=' + $attempt)
                try {
                  $proc = Start-Process -FilePath (Get-Command gh).Source -ArgumentList @('api', $item.api) -NoNewWindow -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
                  if (-not $proc.WaitForExit(30000)) {
                    $proc.Kill($true)
                    $proc.WaitForExit(5000) | Out-Null
                    Write-Output ('FETCH_TIMEOUT ' + $item.filename + ' attempt=' + $attempt)
                  } elseif ($proc.ExitCode -eq 0) {
                    $blobJson = [IO.File]::ReadAllText($stdout)
                    break
                  } else {
                    Write-Output ('FETCH_EXIT ' + $item.filename + ' attempt=' + $attempt + ' code=' + $proc.ExitCode)
                  }
                } finally {
                  Remove-Item -LiteralPath $stdout, $stderr -Force -ErrorAction SilentlyContinue
                }
                if ($attempt -lt 3) { Start-Sleep -Seconds 2 }
              }
              if (-not $blobJson) { throw ('private_f13_artifact_unavailable_' + $item.filename) }
              $blob = $blobJson | ConvertFrom-Json
              if ($blob.encoding -ne 'base64') { throw 'private_f13_artifact_encoding_invalid' }
              $bytes = [Convert]::FromBase64String(($blob.content -replace '\s', ''))
              $digest = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
              if ($digest -ne $item.digest) { throw 'private_f13_artifact_digest_mismatch' }
              $path = Join-Path $env:RUNNER_TEMP ('pock-' + $env:GITHUB_RUN_ID + '-' + $item.filename)
              $paths += $path
              [IO.File]::WriteAllBytes($path, $bytes)
              Write-Output ('FETCH_PASS ' + $item.filename + ' bytes=' + $bytes.Length)
            }
            $linux = @($paths | ForEach-Object {
              if ($_ -notmatch '^[A-Za-z]:\\') { throw 'runner_temp_windows_path_invalid' }
              '/mnt/' + $_.Substring(0, 1).ToLowerInvariant() + $_.Substring(2).Replace('\', '/')
            })
            Write-Output 'WSL_ENTER'
            & wsl.exe -d Ubuntu-26.04 -- python3 -B -u $linux[2] $env:GITHUB_RUN_ID $linux[0] $linux[1] '7ba9ed271738e5fffa5095bbab8e7912b49e2450d182786375cc7e6ff8f48553' '/root/pock-m8-f13-gueststage-36068890418/rootfs'
            if ($LASTEXITCODE -ne 0) { throw "pock_f13_browser_exit_$LASTEXITCODE" }
          } finally {
            foreach ($path in $paths) { Remove-Item -LiteralPath $path -Force -ErrorAction SilentlyContinue }
          }
